name: Checar painel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: index.html montado a partir de src/
        run: node scripts/montar.mjs --check
      - name: Sintaxe do JavaScript
        run: |
          node -e "const s=require('fs').readFileSync('index.html','utf8');const m=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)];require('fs').writeFileSync('/tmp/painel.js',m[m.length-1][1])"
          node --check /tmp/painel.js
      - name: Testes das contas
        run: node --test tests/*.test.mjs
