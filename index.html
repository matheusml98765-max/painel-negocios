<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top Brasil Shop — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<div id="app-root">
  <div id="loading-state" style="padding: 3rem 1rem; text-align: center; color: #6B6558; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    Carregando seu painel...
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<style>
  /* ============ Tema: Top Brasil Shop (roxo + azul elétrico) ============ */
  :root {
    color-scheme: dark;
    --bg: #100C24;
    --bg-glow: rgba(110, 72, 255, 0.18);
    --surface: #1A1538;
    --surface-2: #231C49;
    --surface-3: #2C2459;
    --line: #342B6B;
    --ink: #EFECFF;
    --muted: #A49CD8;
    --field: #140F2E;
    --field-line: #3B3275;
    --accent: #8B5CF6;
    --accent-strong: #A47BFF;
    --accent-ink: #FFFFFF;
    --accent-bg: rgba(139, 92, 246, 0.16);
    --electric: #3D7BFF;
    --good: #34D399;
    --good-bg: rgba(52, 211, 153, 0.14);
    --bad: #FF6B81;
    --bad-bg: rgba(255, 107, 129, 0.13);
    --bad-line: rgba(255, 107, 129, 0.35);
    --warn: #FFC857;
    --warn-bg: rgba(255, 200, 87, 0.12);
    --warn-line: rgba(255, 200, 87, 0.35);
    --s-ml: #9466FF;
    --s-shopee: #1E9AD0;
    --s-tiktok: #DB5590;
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 32px -18px rgba(0,0,0,0.7);
    --radius-lg: 18px;
    --radius: 12px;
    --radius-sm: 8px;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F4F2FF;
    --bg-glow: rgba(109, 61, 240, 0.10);
    --surface: #FFFFFF;
    --surface-2: #F0EDFF;
    --surface-3: #E6E1FD;
    --line: #DED8F8;
    --ink: #19143A;
    --muted: #615B8C;
    --field: #FBFAFF;
    --field-line: #CFC7F2;
    --accent: #6D3DF0;
    --accent-strong: #5A2BDB;
    --accent-ink: #FFFFFF;
    --accent-bg: rgba(109, 61, 240, 0.10);
    --electric: #2563EB;
    --good: #047857;
    --good-bg: rgba(4, 120, 87, 0.10);
    --bad: #D61F45;
    --bad-bg: rgba(214, 31, 69, 0.08);
    --bad-line: rgba(214, 31, 69, 0.30);
    --warn: #B45309;
    --warn-bg: rgba(180, 83, 9, 0.09);
    --warn-line: rgba(180, 83, 9, 0.30);
    --s-ml: #6D3DF0;
    --s-shopee: #0E87BF;
    --s-tiktok: #C93A6E;
    --shadow: 0 1px 2px rgba(25, 20, 58, 0.05), 0 14px 30px -20px rgba(45, 30, 120, 0.35);
  }

  html, body { margin: 0; background: var(--bg); }
  #app-root * { box-sizing: border-box; }
  #app-root {
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    background:
      radial-gradient(1100px 520px at 85% -10%, var(--bg-glow), transparent 60%),
      radial-gradient(900px 480px at -10% 0%, rgba(61, 123, 255, 0.10), transparent 55%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
    transition: background-color .3s ease, color .3s ease;
  }
  #app-root button:focus-visible, #app-root input:focus-visible, #app-root select:focus-visible, #app-root summary:focus-visible {
    outline: 2px solid var(--electric); outline-offset: 2px;
  }
  .pml-wrap { max-width: 1240px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }
  .pml-wrap.largo { max-width: 1240px; }

  /* Cabecalho */
  .pml-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .pml-marca { display: flex; align-items: center; gap: 14px; }
  .pml-logo { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--electric)); color: #fff; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: -0.02em; box-shadow: 0 8px 24px -10px var(--accent); }
  .pml-title { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 700; margin: 0; color: var(--ink); letter-spacing: -0.02em; }
  .pml-subtitle { font-size: 13.5px; color: var(--muted); margin: 2px 0 0; }
  .pml-header-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pml-tema-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 999px; font: 600 13px 'Manrope', sans-serif; cursor: pointer; }
  .pml-tema-btn:hover { border-color: var(--accent); }

  /* Abas */
  .pml-tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); padding: 5px; border-radius: 14px; margin-bottom: 1.75rem; width: fit-content; max-width: 100%; flex-wrap: wrap; box-shadow: var(--shadow); }
  .pml-tab { border: none; background: transparent; padding: 9px 18px; font-size: 14px; font-weight: 600; color: var(--muted); border-radius: 10px; cursor: pointer; font-family: inherit; transition: color .15s ease, background-color .15s ease; }
  .pml-tab:hover { color: var(--ink); }
  .pml-tab.active { background: linear-gradient(135deg, var(--accent), var(--electric)); color: #fff; box-shadow: 0 6px 18px -8px var(--accent); }

  /* Metricas e cards */
  .pml-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 1.5rem; }
  .pml-metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .pml-metric-label { font-size: 12.5px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .pml-metric-value { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; margin: 0; color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .pml-metric-value.pos { color: var(--good); }
  .pml-metric-value.neg { color: var(--bad); }
  .pml-section-title { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; margin: 0 0 12px; color: var(--ink); letter-spacing: -0.01em; }
  .pml-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow); }

  /* Formularios e botoes */
  .pml-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .pml-field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .pml-field input, .pml-field select { width: 100%; padding: 9px 11px; border: 1px solid var(--field-line); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: var(--field); color: var(--ink); }
  .pml-field input:focus, .pml-field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  #app-root input, #app-root select { color: var(--ink); background-color: var(--field); }
  .pml-btn { background: linear-gradient(135deg, var(--accent), var(--electric)); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 8px 20px -12px var(--accent); }
  .pml-btn:hover { filter: brightness(1.08); }
  .pml-btn.secondary { background: transparent; color: var(--bad); border: 1px solid var(--line); padding: 6px 11px; font-size: 12px; box-shadow: none; font-weight: 600; }
  .pml-btn.secondary:hover { background: var(--bad-bg); filter: none; }
  .pml-error { color: var(--bad); font-size: 12.5px; margin: -6px 0 12px; }

  /* Tabelas */
  .pml-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .pml-table th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .pml-table td { padding: 11px 10px; border-bottom: 1px solid var(--line); }
  .pml-table tr:last-child td { border-bottom: none; }
  .pml-table tr:hover td { background: var(--surface-2); }

  /* Selos */
  .pml-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .pml-badge.venda { background: var(--good-bg); color: var(--good); }
  .pml-badge.compra { background: var(--warn-bg); color: var(--warn); }
  .pml-badge.despesa { background: var(--bad-bg); color: var(--bad); }
  .pml-badge.devolucao { background: var(--accent-bg); color: var(--accent-strong); }
  .pml-badge.cancelamento { background: var(--surface-2); color: var(--muted); }
  .pml-badge.reembolso { background: var(--bad-bg); color: var(--bad); }
  .pml-empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 14px; }
  .pml-margin { font-size: 12.5px; color: var(--muted); }
  .pml-drop { border: 2px dashed var(--field-line); border-radius: var(--radius); padding: 28px 20px; text-align: center; background: var(--field); }
  .pml-drop input { display: block; margin: 10px auto 0; }
  .pml-import-summary { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; font-size: 13px; line-height: 1.7; }
  .pml-import-summary b { color: var(--ink); }
  .pml-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .pml-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  .pml-table td.num, .pml-table th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pml-tabela-lucro { min-width: 900px; }
  .pml-tabela-lucro td:first-child { min-width: 240px; max-width: 300px; }
  .pml-titulo-prod { font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
  .pml-row-alerta td { background: var(--bad-bg); }
  .pml-row-atencao td { background: var(--warn-bg); }
  .pml-tag { display: inline-block; white-space: nowrap; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-left: 6px; vertical-align: 1px; }
  .pml-tag.prejuizo { background: var(--bad-bg); color: var(--bad); }
  .pml-tag.baixa { background: var(--warn-bg); color: var(--warn); }
  .pml-tag.boa { background: var(--good-bg); color: var(--good); }
  .pml-custo-input { width: 92px; padding: 5px 7px; border: 1px dashed var(--accent); border-radius: 7px; font-size: 12.5px; background: var(--field); font-family: inherit; color: var(--ink); }
  .pml-filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .pml-filtros .pml-field { flex: 1 1 150px; max-width: 230px; }
  .pml-barra { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
  .pml-barra span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--electric)); border-radius: 999px; }
  .pml-fat-cat { border-top: 1px solid var(--line); padding: 11px 0; }
  .pml-fat-cat summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; font-size: 14px; list-style: none; }
  .pml-fat-cat summary::-webkit-details-marker { display: none; }
  .pml-fat-linha { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); padding: 5px 0 0 14px; }
  .pml-dica { background: var(--accent-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; font-size: 13.5px; line-height: 1.65; color: var(--ink); margin-top: 12px; }

  /* ================= Inicio ================= */
  .ini-saudacao { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 0 22px; }
  .ini-saudacao h1 { font-family: 'Sora', sans-serif; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0; letter-spacing: -0.03em; font-weight: 700; }
  .ini-saudacao p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .ini-atualizado { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .ini-pulso { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulso 2.2s infinite; }
  .ini-pulso.parado { background: var(--warn); animation: none; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.5); } 70% { box-shadow: 0 0 0 9px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }

  .ini-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .ini-hoje { grid-column: span 5; position: relative; overflow: hidden; border-radius: 22px; padding: 26px; color: #fff; background: linear-gradient(140deg, #5B2EE8 0%, #3D5BFF 55%, #1E9AD0 120%); box-shadow: 0 24px 50px -28px #5B2EE8; }
  .ini-hoje::after { content: ''; position: absolute; inset: auto -60px -90px auto; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), transparent 65%); }
  .ini-hoje h2 { margin: 0; font: 600 14px 'Manrope', sans-serif; opacity: .85; }
  .ini-hoje .valor { font-family: 'Sora', sans-serif; font-size: clamp(36px, 5vw, 54px); font-weight: 800; letter-spacing: -0.04em; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
  .ini-hoje .linha { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 18px; position: relative; z-index: 1; }
  .ini-hoje .linha div { min-width: 90px; }
  .ini-hoje .linha b { display: block; font-family: 'Sora', sans-serif; font-size: 20px; }
  .ini-hoje .linha span { font-size: 12.5px; opacity: .8; }
  .ini-hoje .comp { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.16); padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }

  .ini-mes { grid-column: span 7; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .ini-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; min-height: 128px; }
  .ini-kpi .rotulo { font-size: 13px; font-weight: 600; color: var(--muted); }
  .ini-kpi .num { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .ini-kpi .sub { font-size: 12.5px; color: var(--muted); }
  .ini-kpi .num.pos { color: var(--good); } .ini-kpi .num.neg { color: var(--bad); }

  .ini-bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; box-shadow: var(--shadow); }
  .ini-bloco h3 { font-family: 'Sora', sans-serif; font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  .ini-bloco .cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .ini-legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .ini-legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .ini-grafico { position: relative; height: 290px; }
  .ini-grafico.baixo { height: 230px; }
  .ini-c8 { grid-column: span 8; } .ini-c4 { grid-column: span 4; } .ini-c6 { grid-column: span 6; } .ini-c12 { grid-column: span 12; }
  .ini-alerta { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .ini-alerta:first-of-type { border-top: none; }
  .ini-alerta .ic { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
  .ini-alerta .ic.bad { background: var(--bad-bg); } .ini-alerta .ic.warn { background: var(--warn-bg); } .ini-alerta .ic.good { background: var(--good-bg); }
  .ini-alerta b { display: block; font-weight: 700; }
  .ini-alerta span { color: var(--muted); }
  .ini-tabela-mini { width: 100%; font-size: 13px; border-collapse: collapse; }
  .ini-tabela-mini td { padding: 6px 0; border-top: 1px solid var(--line); }
  .ini-tabela-mini td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .ini-ver-tabela { background: none; border: none; color: var(--accent-strong); font: 600 12.5px 'Manrope', sans-serif; cursor: pointer; padding: 0; }

  @media (max-width: 980px) {
    .ini-hoje, .ini-mes, .ini-c8, .ini-c4, .ini-c6 { grid-column: span 12; }
  }
  @media (max-width: 560px) {
    .pml-wrap { padding: 1.25rem 1rem 3rem; }
    .ini-mes { grid-template-columns: 1fr; }
    .ini-hoje { padding: 22px; }
  }

  /* ================= Intro ================= */
  #intro { position: fixed; inset: 0; z-index: 9999; background: #07051A; display: grid; place-items: center; overflow: hidden; cursor: pointer; transition: opacity .9s ease, filter .9s ease; }
  #intro.saindo { opacity: 0; filter: blur(8px); pointer-events: none; }
  #intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #intro .intro-texto { position: relative; z-index: 2; text-align: center; color: #fff; padding: 0 20px; margin-top: 26vh; }
  #intro .intro-ola { font-family: 'Sora', sans-serif; font-size: clamp(26px, 4.2vw, 46px); font-weight: 700; letter-spacing: -0.03em; opacity: 0; transform: translateY(14px); transition: opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1); }
  #intro .intro-sub { margin-top: 10px; font-size: clamp(14px, 1.6vw, 17px); color: #B9B2F2; opacity: 0; transition: opacity 1s ease .25s; }
  #intro.mostrar-texto .intro-ola { opacity: 1; transform: none; }
  #intro.mostrar-texto .intro-sub { opacity: 1; }
  #intro .intro-pular { position: absolute; z-index: 3; right: 22px; bottom: 20px; color: #8D86C9; font: 600 13px 'Manrope', sans-serif; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  #intro .intro-pular:hover { color: #fff; }
  @media (prefers-reduced-motion: reduce) {
    .ini-pulso { animation: none; }
    #intro { transition: opacity .3s ease; }
  }
  /* Metas */
  .meta-linha { margin-top: 6px; }
  .meta-linha + .meta-linha { margin-top: 18px; }
  .meta-topo { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; }
  .meta-rotulo { font-weight: 700; }
  .meta-num { font-family: 'Sora', sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meta-trilho { position: relative; height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meta-trilho span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .meta-proj { background: var(--accent-bg); outline: 1px dashed var(--accent); outline-offset: -1px; }
  .meta-feito { background: linear-gradient(90deg, var(--accent), var(--electric)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .meta-texto { margin: 8px 0 0; font-size: 13.5px; }

  /* Mapa de calor */
  .calor-grade { display: grid; grid-template-columns: 38px repeat(24, minmax(18px, 1fr)); gap: 3px; min-width: 620px; }
  .calor-canto { }
  .calor-hora { font-size: 11px; color: var(--muted); text-align: left; }
  .calor-dia { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; }
  .calor-cel { height: 22px; border-radius: 5px; background: var(--surface-2); }
  .calor-cel:focus-visible { outline: 2px solid var(--electric); outline-offset: 1px; }
  .calor-cel.n1 { background: color-mix(in srgb, var(--accent) 22%, var(--surface-2)); }
  .calor-cel.n2 { background: color-mix(in srgb, var(--accent) 42%, var(--surface-2)); }
  .calor-cel.n3 { background: color-mix(in srgb, var(--accent) 62%, var(--surface-2)); }
  .calor-cel.n4 { background: color-mix(in srgb, var(--accent) 82%, var(--surface-2)); }
  .calor-cel.n5 { background: var(--accent); }

<script>
(function () {
  // Fora do ambiente do Claude (ex: GitHub Pages), window.storage não existe.
  // Este polyfill usa o localStorage do navegador nesse caso, sem mudar o resto do código.
  if (!window.storage) {
    window.storage = {
      get: function (key) {
        var v = localStorage.getItem('pml_' + key);
        return Promise.resolve(v === null ? null : { key: key, value: v });
      },
      set: function (key, value) {
        localStorage.setItem('pml_' + key, value);
        return Promise.resolve({ key: key, value: value });
      }
    };
  }

  var root = document.getElementById('app-root');
  var state = { tab: 'geral', produtos: [], transacoes: [], loaded: false, errorMsg: '', gistUrl: '', gistUrlShopee: '', ultimaSincronizacao: '', ultimaSincronizacaoShopee: '', sincronizando: false, sincronizandoShopee: false, confirmarLimpeza: false, editandoProdutoId: null, ultimaBaixaEstoque: [], faturamento: null, adsShopee: null, custosAvulsos: {}, configLucro: { imposto: 4, margemAlvo: 25, dias: 30, ordem: 'receita', plataforma: 'todas' }, fatPeriodo: '', calc3d: null, metas: {}, editandoMeta: false, statusAuto: null, fichaProduto: null, simDesconto: 10, relMes: '', anunciosMl: null, devolucoes: null, liberacoes: null, mesLuz: '', cpfMes: '', tarefasRemotas: null, cpfRemoto: null, contasRemotas: null, contasMes: '', comprasVisao: 'semana', diaVendas: '', atualizandoAgora: null, pedirTokenAtualizar: false, erroToken: '', producaoRemota: null, abrirFalha: false, ultimaCopiaNuvem: null, erroNuvem: '', receberRemoto: null, conquistasRemotas: null, rotinaRemota: null };

  function fmtMoney(n) {
    var v = Number(n);
    if (isNaN(v)) v = 0;
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  var pilhaUndo = [];
  var pilhaRedo = [];

  function estadoAtualSnapshot() {
    return {
      produtos: JSON.parse(JSON.stringify(state.produtos)),
      transacoes: JSON.parse(JSON.stringify(state.transacoes))
    };
  }

  function salvarSnapshotUndo() {
    pilhaUndo.push(estadoAtualSnapshot());
    if (pilhaUndo.length > 20) pilhaUndo.shift();
    pilhaRedo = [];
  }

  function desfazer() {
    if (pilhaUndo.length === 0) return;
    pilhaRedo.push(estadoAtualSnapshot());
    var anterior = pilhaUndo.pop();
    state.produtos = anterior.produtos;
    state.transacoes = anterior.transacoes;
    saveProdutos();
    saveTransacoes();
    render();
  }

  function refazer() {
    if (pilhaRedo.length === 0) return;
    pilhaUndo.push(estadoAtualSnapshot());
    var proximo = pilhaRedo.pop();
    state.produtos = proximo.produtos;
    state.transacoes = proximo.transacoes;
    saveProdutos();
    saveTransacoes();
    render();
  }

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      var alvo = e.target;
      var digitando = alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'SELECT' || alvo.tagName === 'TEXTAREA');
      if (!digitando) {
        e.preventDefault();
        if (e.shiftKey) { refazer(); } else { desfazer(); }
      }
    }
  });

  async function loadData() {
    try {
      var mt = await window.storage.get('ml-metas');
      state.metas = mt ? JSON.parse(mt.value) : {};
    } catch (e) { state.metas = {}; }
    try {
      var p = await window.storage.get('ml-produtos');
      state.produtos = p ? JSON.parse(p.value) : [];
    } catch (e) { state.produtos = []; }
    try {
      var t = await window.storage.get('ml-transacoes');
      state.transacoes = t ? JSON.parse(t.value) : [];
    } catch (e) { state.transacoes = []; }
    try {
      var g = await window.storage.get('ml-gist-url');
      state.gistUrl = g ? g.value : '';
    } catch (e) { state.gistUrl = ''; }
    try {
      var gs = await window.storage.get('ml-gist-url-shopee');
      state.gistUrlShopee = gs ? gs.value : '';
    } catch (e) { state.gistUrlShopee = ''; }
    try {
      var u = await window.storage.get('ml-ultima-sync');
      state.ultimaSincronizacao = u ? u.value : '';
    } catch (e) { state.ultimaSincronizacao = ''; }
    try {
      var us = await window.storage.get('ml-ultima-sync-shopee');
      state.ultimaSincronizacaoShopee = us ? us.value : '';
    } catch (e) { state.ultimaSincronizacaoShopee = ''; }
    try {
      var fa = await window.storage.get('ml-faturamento');
      state.faturamento = fa ? JSON.parse(fa.value) : null;
    } catch (e) { state.faturamento = null; }
    try {
      var lb = await window.storage.get('ml-liberacoes');
      state.liberacoes = lb ? JSON.parse(lb.value) : null;
    } catch (e) { state.liberacoes = null; }
    try {
      var an = await window.storage.get('ml-anuncios');
      state.anunciosMl = an ? JSON.parse(an.value) : null;
    } catch (e) { state.anunciosMl = null; }
    try {
      var dv = await window.storage.get('ml-devolucoes');
      state.devolucoes = dv ? JSON.parse(dv.value) : null;
    } catch (e) { state.devolucoes = null; }
    try {
      var ads = await window.storage.get('ml-ads-shopee');
      state.adsShopee = ads ? JSON.parse(ads.value) : null;
    } catch (e) { state.adsShopee = null; }
    try {
      var ca = await window.storage.get('ml-custos-avulsos');
      state.custosAvulsos = ca ? JSON.parse(ca.value) : {};
    } catch (e) { state.custosAvulsos = {}; }
    try {
      var c3 = await window.storage.get('ml-calc3d');
      if (c3) { var base3 = calc3dPadrao(); var salvo3 = JSON.parse(c3.value); Object.keys(salvo3).forEach(function (k) { base3[k] = salvo3[k]; }); state.calc3d = base3; }
    } catch (e) {}
    try {
      var cl = await window.storage.get('ml-config-lucro');
      if (cl) { var cfg = JSON.parse(cl.value); Object.keys(cfg).forEach(function (k) { state.configLucro[k] = cfg[k]; }); }
    } catch (e) {}
    // A automacao manda a Shopee para o mesmo Gist do ML. Se so o link do ML
    // estiver salvo, descobre o da Shopee sozinho.
    if (!state.gistUrlShopee && state.gistUrl) {
      try {
        var urlShopee = urlArquivoIrmao(state.gistUrl, 'pedidos_shopee.json');
        var teste = await fetch(urlShopee + '?_=' + Date.now());
        if (teste.ok) await salvarGistUrlShopee(urlShopee);
      } catch (e) {}
    }
    state.loaded = true;
    render();
    if (state.gistUrl) { sincronizarGist(true); }
    if (state.gistUrlShopee) { sincronizarGistShopee(true); }
  }

  async function salvarGistUrl(url) {
    state.gistUrl = url;
    try { await window.storage.set('ml-gist-url', url); } catch (e) {}
  }

  async function salvarGistUrlShopee(url) {
    state.gistUrlShopee = url;
    try { await window.storage.set('ml-gist-url-shopee', url); } catch (e) {}
  }

  // O link "raw" do Gist pode vir preso a uma versao antiga (/raw/<codigo>/arquivo).
  // Tirando esse codigo, o painel sempre busca a versao mais recente.
  function urlGistAtual(url) {
    return String(url || '').replace(/\/raw\/[0-9a-f]{40}\//, '/raw/');
  }

  function urlArquivoIrmao(url, nomeArquivo) {
    var base = urlGistAtual(url).split('?')[0];
    return base.replace(/[^\/]+$/, nomeArquivo);
  }

  async function sincronizarFaturamento() {
    if (!state.gistUrl) return;
    try {
      // status.json: hora da ultima execucao da automacao (a fatura so atualiza a cada 6 h)
      var rs = await fetch(urlArquivoIrmao(state.gistUrl, 'status.json') + '?_=' + Date.now());
      if (rs.ok) { var st = await rs.json(); if (st && st.atualizado_em) state.statusAuto = st; }
    } catch (e) {}
    try {
      var r = await fetch(urlArquivoIrmao(state.gistUrl, 'faturamento.json') + '?_=' + Date.now());
      if (!r.ok) return;
      var dados = await r.json();
      if (dados && Array.isArray(dados.periodos)) {
        state.faturamento = dados;
        try { await window.storage.set('ml-faturamento', JSON.stringify(dados)); } catch (e) {}
      }
    } catch (e) {}
  }

  // Estoque e Product Ads dos anuncios do ML (anuncios_ml.json da automacao)
  async function sincronizarAnunciosMl() {
    if (!state.gistUrl) return;
    try {
      var r = await fetch(urlArquivoIrmao(state.gistUrl, 'anuncios_ml.json') + '?_=' + Date.now());
      if (!r.ok) return;
      var dados = await r.json();
      if (dados && Array.isArray(dados.itens)) {
        state.anunciosMl = dados;
        try { await window.storage.set('ml-anuncios', JSON.stringify(dados)); } catch (e) {}
      }
    } catch (e) {}
    try {
      // Relatorio de liberacoes do Mercado Pago (dinheiro que entrou e saiu de cada venda)
      var rl = await fetch(urlArquivoIrmao(state.gistUrl, 'liberacoes_mp.json') + '?_=' + Date.now());
      if (rl.ok) {
        var lb = await rl.json();
        if (lb && lb.pedidos) {
          state.liberacoes = lb;
          try { await window.storage.set('ml-liberacoes', JSON.stringify(lb)); } catch (e) {}
        }
      }
    } catch (e) {}
    try {
      var rd = await fetch(urlArquivoIrmao(state.gistUrl, 'devolucoes.json') + '?_=' + Date.now());
      if (rd.ok) {
        var dv = await rd.json();
        if (dv && Array.isArray(dv.itens)) {
          state.devolucoes = dv;
          try { await window.storage.set('ml-devolucoes', JSON.stringify(dv)); } catch (e) {}
        }
      }
    } catch (e) {}
  }

  async function sincronizarAdsShopee() {
    if (!state.gistUrlShopee) return;
    try {
      var r = await fetch(urlArquivoIrmao(state.gistUrlShopee, 'ads_shopee.json') + '?_=' + Date.now());
      if (!r.ok) return;
      var dados = await r.json();
      if (dados && Array.isArray(dados.dias)) {
        state.adsShopee = dados;
        try { await window.storage.set('ml-ads-shopee', JSON.stringify(dados)); } catch (e) {}
      }
    } catch (e) {}
  }

  async function salvarCustosAvulsos() {
    try { await window.storage.set('ml-custos-avulsos', JSON.stringify(state.custosAvulsos)); } catch (e) {}
  }

  async function salvarConfigLucro() {
    try { await window.storage.set('ml-config-lucro', JSON.stringify(state.configLucro)); } catch (e) {}
  }

  // Historico do ano (historico_ml.json / historico_shopee.json da automacao): vendas de antes da
  // janela de 35 dias. Busca no maximo a cada 6 h e nao baixa o estoque (sao vendas antigas).
  async function sincronizarHistorico(urlGist, nome, prefixo, rotulo) {
    if (!urlGist) return;
    var chave = 'ml-historico-' + nome, agora = Date.now();
    try { var u = await window.storage.get(chave); if (u && agora - Number(u.value) < 6 * 3600 * 1000) return; } catch (e) {}
    try {
      var r = await fetch(urlArquivoIrmao(urlGist, nome) + '?_=' + agora);
      if (!r.ok) return;
      var res = parseApiJson(await r.text(), prefixo, rotulo);
      if (res.erro) return;
      if (res.novas.length) {
        state.transacoes = state.transacoes.concat(res.novas);
        state.transacoes.sort(function (a, b) { return b.data.localeCompare(a.data); });
      }
      if (res.novas.length || res.atualizadas) await saveTransacoes();
      try { await window.storage.set(chave, String(agora)); } catch (e) {}
    } catch (e) {}
  }

  async function sincronizarGist(silencioso) {
    if (!state.gistUrl) return;
    state.sincronizando = true;
    if (!silencioso) render();
    try {
      var urlAtual = urlGistAtual(state.gistUrl);
      var resposta = await fetch(urlAtual + (urlAtual.indexOf('?') === -1 ? '?_=' : '&_=') + Date.now());
      var texto = await resposta.text();
      var resultado = parseApiJson(texto, 'api-ml-', 'Mercado Livre');
      if (!resultado.erro && resultado.novas.length > 0) {
        salvarSnapshotUndo();
        state.transacoes = state.transacoes.concat(resultado.novas);
        state.transacoes.sort(function (a, b) { return b.data.localeCompare(a.data); });
        await saveTransacoes();
        var baixas = baixarEstoquePorVendas(resultado.novas);
        if (baixas.length > 0) {
          await saveProdutos();
          state.ultimaBaixaEstoque = baixas;
        }
      } else if (!resultado.erro && resultado.atualizadas > 0) {
        await saveTransacoes();
      }
      await sincronizarHistorico(state.gistUrl, 'historico_ml.json', 'api-ml-', 'Mercado Livre');
      await sincronizarFaturamento();
      await sincronizarAnunciosMl();
      await sincronizarTarefasCpf();
      state.ultimaSincronizacao = new Date().toLocaleString('pt-BR');
      try { await window.storage.set('ml-ultima-sync', state.ultimaSincronizacao); } catch (e) {}
      state.errorMsg = '';
    } catch (e) {
      state.errorMsg = 'Não consegui sincronizar com a nuvem agora. Confere sua internet ou a URL configurada.';
    }
    state.sincronizando = false;
    render();
  }

  async function sincronizarGistShopee(silencioso) {
    if (!state.gistUrlShopee) return;
    state.sincronizandoShopee = true;
    if (!silencioso) render();
    try {
      var urlAtualShopee = urlGistAtual(state.gistUrlShopee);
      var resposta = await fetch(urlAtualShopee + (urlAtualShopee.indexOf('?') === -1 ? '?_=' : '&_=') + Date.now());
      var texto = await resposta.text();
      var resultado = parseApiJson(texto, 'api-shopee-', 'Shopee');
      if (!resultado.erro && resultado.novas.length > 0) {
        salvarSnapshotUndo();
        state.transacoes = state.transacoes.concat(resultado.novas);
        state.transacoes.sort(function (a, b) { return b.data.localeCompare(a.data); });
        await saveTransacoes();
        var baixas = baixarEstoquePorVendas(resultado.novas);
        if (baixas.length > 0) {
          await saveProdutos();
          state.ultimaBaixaEstoque = baixas;
        }
      } else if (!resultado.erro && resultado.atualizadas > 0) {
        await saveTransacoes();
      }

  var NOMES_MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  function calcSeriesMensais() {
    var porMes = {};
    state.transacoes.forEach(function (t) {
      var mesKey = String(t.data).slice(0, 7);
      if (!mesKey || mesKey.length !== 7) return;
      if (!porMes[mesKey]) porMes[mesKey] = { vendas: 0, saidas: 0 };
      if (t.tipo === 'venda') porMes[mesKey].vendas += Number(t.valor) || 0;
      else porMes[mesKey].saidas += Number(t.valor) || 0;
    });
    var chaves = Object.keys(porMes).sort();
    return chaves.map(function (k) {
      var partes = k.split('-');
      var mesIdx = parseInt(partes[1], 10) - 1;
      return { mes: k, label: NOMES_MESES[mesIdx] + '/' + partes[0].slice(2), vendas: porMes[k].vendas, saidas: porMes[k].saidas };
    });
  }

  function renderGraficoVendas(wrap) {
    var serie = calcSeriesMensais();
    var card = el('div', { class: 'pml-card' });
    card.appendChild(el('p', { class: 'pml-section-title', text: 'Vendas por mês' }));
    if (serie.length === 0) {
      card.appendChild(el('div', { class: 'pml-empty', text: 'Ainda não há vendas suficientes para mostrar um gráfico.' }));
      wrap.appendChild(card);
      return;
    }
    var maxValor = Math.max.apply(null, serie.map(function (s) { return Math.max(s.vendas, s.saidas); })) || 1;
    var largura = Math.max(320, serie.length * 90);
    var altura = 220;
    var baseY = altura - 30;
    var alturaUtil = baseY - 20;
    var larguraGrupo = largura / serie.length;

    var svgPartes = [];
    svgPartes.push('<svg viewBox="0 0 ' + largura + ' ' + altura + '" style="width:100%; height:auto; max-width:' + largura + 'px; font-family:inherit;">');
    svgPartes.push('<line x1="0" y1="' + baseY + '" x2="' + largura + '" y2="' + baseY + '" stroke="var(--line)" stroke-width="1" />');
    serie.forEach(function (s, i) {
      var cx = i * larguraGrupo + larguraGrupo / 2;
      var barW = Math.min(28, larguraGrupo * 0.28);
      var hVenda = (s.vendas / maxValor) * alturaUtil;
      var hSaida = (s.saidas / maxValor) * alturaUtil;
      var xVenda = cx - barW - 3;
      var xSaida = cx + 3;
      svgPartes.push('<rect x="' + xVenda + '" y="' + (baseY - hVenda) + '" width="' + barW + '" height="' + hVenda + '" fill="var(--good)" rx="2" />');
      svgPartes.push('<rect x="' + xSaida + '" y="' + (baseY - hSaida) + '" width="' + barW + '" height="' + hSaida + '" fill="var(--bad)" rx="2" />');
      svgPartes.push('<text x="' + cx + '" y="' + (baseY + 16) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + s.label + '</text>');
    });
    svgPartes.push('</svg>');

    var svgWrap = el('div', { style: 'overflow-x:auto;' });
    svgWrap.innerHTML = svgPartes.join('');
    card.appendChild(svgWrap);

    var legenda = el('div', { style: 'display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--muted);' });
    legenda.innerHTML = '<span><span style="display:inline-block; width:10px; height:10px; background:var(--good); border-radius:2px; margin-right:5px;"></span>Vendas</span><span><span style="display:inline-block; width:10px; height:10px; background:var(--bad); border-radius:2px; margin-right:5px;"></span>Saídas (custos, reembolsos, cancelamentos etc)</span>';
    card.appendChild(legenda);
    wrap.appendChild(card);
  }

  function calcMetrics() {
    var valorEstoque = state.produtos.reduce(function (sum, p) {
      return sum + (Number(p.custo) || 0) * (Number(p.quantidade) || 0);
    }, 0);
    var qtdProdutos = state.produtos.length;

    var now = new Date();
    var mesAtual = now.getMonth();
    var anoAtual = now.getFullYear();
    var entradasMes = 0, saidasMes = 0;
    state.transacoes.forEach(function (t) {
      var d = new Date(t.data + 'T00:00:00');
      if (d.getMonth() === mesAtual && d.getFullYear() === anoAtual) {
        if (t.tipo === 'venda') entradasMes += Number(t.valor) || 0;
        else saidasMes += Number(t.valor) || 0;
      }
      // compra, despesa, devolucao, cancelamento e reembolso contam como saída do mês
    });
    var saldoMes = entradasMes - saidasMes;
    var entradasTotal = 0, saidasTotal = 0;
    state.transacoes.forEach(function (t) {
      if (t.tipo === 'venda') entradasTotal += Number(t.valor) || 0;
      else saidasTotal += Number(t.valor) || 0;
    });
    var saldoTotal = entradasTotal - saidasTotal;
    return { valorEstoque: valorEstoque, qtdProdutos: qtdProdutos, saldoMes: saldoMes, saldoTotal: saldoTotal };
  }

  // Texto com formatacao simples (negrito, quebra de linha, cor) vindo de dados de fora:
  // so passam b/strong/i/em/br/span/small e os atributos style e class; o resto vira texto.
  var TAGS_OK = { B: 1, STRONG: 1, I: 1, EM: 1, BR: 1, SPAN: 1, SMALL: 1 };
  function htmlSeguro(html) {
    var t = document.createElement('template');
    t.innerHTML = String(html === undefined || html === null ? '' : html);
    (function limpar(no) {
      Array.prototype.slice.call(no.childNodes).forEach(function (n) {
        if (n.nodeType === 1) {
          if (!TAGS_OK[n.tagName]) { no.replaceChild(document.createTextNode(n.textContent), n); return; }
          Array.prototype.slice.call(n.attributes).forEach(function (a) {
            if ((a.name !== 'style' && a.name !== 'class') || /url\s*\(|expression|javascript:/i.test(a.value)) n.removeAttribute(a.name);
          });
          limpar(n);
        } else if (n.nodeType !== 3) no.removeChild(n);
      });
    })(t.content);
    var d = document.createElement('div'); d.appendChild(t.content); return d.innerHTML;
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = htmlSeguro(attrs[k]);
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }

  function fonteAtrasada(url, ultimaSync) {
    if (!url) return false;
    if (!ultimaSync) return true;
    var partes = ultimaSync.match(/(\d{2})\/(\d{2})\/(\d{4}),?\s+(\d{2}):(\d{2})/);
    if (!partes) return false;
    var dataSync = new Date(partes[3], partes[2] - 1, partes[1], partes[4], partes[5]);
    var horasPassadas = (Date.now() - dataSync.getTime()) / (1000 * 60 * 60);
    return horasPassadas > 48;
  }

  function baixarEstoquePorVendas(novas) {
    var relatorio = [];
    novas.forEach(function (t) {
      if (t.tipo !== 'venda' || !Array.isArray(t.itens)) return;
      t.itens.forEach(function (item) {
        if (!item.item_id) return;
        var produto = state.produtos.find(function (p) { return p.mlItemId === item.item_id; });
        if (produto) {
          var qtdVendida = Number(item.quantidade) || 1;
          var qtdAntes = Number(produto.quantidade) || 0;
          produto.quantidade = Math.max(0, qtdAntes - qtdVendida);
          relatorio.push(produto.nome + ': -' + qtdVendida + ' (de ' + qtdAntes + ' para ' + produto.quantidade + ')');
        }
      });
      t.estoqueAplicado = true;
    });
    return relatorio;
  }

  function parseMercadoLivreCsv(text) {
    var linhas = text.split(/\r?\n/).filter(function (l) { return l.trim().length > 0; });
    if (linhas.length < 2) return { novas: [], ignoradas: 0 };
    var header = linhas[0].split(';');
    var idxTipo = header.indexOf('TRANSACTION_TYPE');
    var idxData = header.indexOf('TRANSACTION_DATE');
    var idxValor = header.indexOf('REAL_AMOUNT');
    var idxSource = header.indexOf('SOURCE_ID');
    if (idxTipo === -1 || idxValor === -1) return { novas: [], ignoradas: 0, erro: true };
    var novas = [];
    var ignoradas = 0;
    for (var i = 1; i < linhas.length; i++) {
      var cols = linhas[i].split(';');
      var tipoRaw = (cols[idxTipo] || '').trim();
      var valor = parseFloat(cols[idxValor]);
      var dataRaw = (cols[idxData] || '').trim();
      var data = dataRaw ? dataRaw.split('T')[0] : '';
      var sourceId = (cols[idxSource] || '').trim();
      var origemId = 'ml-' + sourceId + '-' + tipoRaw + '-' + i;
      if (isNaN(valor) || !data) { continue; }
      var tipoFinal = null;
      if (tipoRaw === 'SETTLEMENT' || tipoRaw === 'SETTLEMENT_SHIPPING') tipoFinal = 'venda';
      else if (tipoRaw === 'REFUND') tipoFinal = 'reembolso';
      else if (tipoRaw === 'DISPUTE') tipoFinal = 'devolucao';
      if (!tipoFinal) { ignoradas++; continue; }
      if (jaImportado(origemId)) { ignoradas++; continue; }
      novas.push({
        id: uid(), origemId: origemId, data: data, tipo: tipoFinal,
        descricao: 'Mercado Livre - pedido ' + sourceId + ' (' + tipoRaw + ')',
        valor: Math.abs(valor)
      });
    }
    return { novas: novas, ignoradas: ignoradas };
  }

  function parseShopeeRows(rows) {
    var headerIdx = -1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i] && rows[i].indexOf('Tipo de transação') !== -1) { headerIdx = i; break; }
    }
    if (headerIdx === -1) return { novas: [], ignoradas: 0, erro: true };
    var novas = [];
    var ignoradas = 0;
    for (var i = headerIdx + 1; i < rows.length; i++) {
      var r = rows[i];
      if (!r || r.length < 6) continue;
      var dataRaw = String(r[0] || '').trim();
      var tipoRaw = String(r[1] || '').trim();
      var descricao = String(r[2] || '').trim();
      var idPedido = String(r[3] || '').trim();
      var direcao = String(r[4] || '').trim();
      var valor = parseFloat(r[5]);
      if (!dataRaw || isNaN(valor)) continue;
      var data = dataRaw.split(' ')[0];
      var origemId = 'shopee-' + idPedido + '-' + tipoRaw + '-' + i;
      var tipoFinal = null;
      var descLower = descricao.toLowerCase();
      if (tipoRaw === 'Saques' || tipoRaw === 'Shopee Acelera') {
        ignoradas++; continue;
      } else if (tipoRaw === 'Renda do pedido') {
        tipoFinal = direcao === 'Entrada' ? 'venda' : 'despesa';
      } else if (tipoRaw === 'Ajuste') {
        tipoFinal = (descLower.indexOf('reembolso') !== -1 || descLower.indexOf('devolução') !== -1 || descLower.indexOf('devolucao') !== -1) ? 'reembolso' : 'despesa';
      } else if (tipoRaw === 'Saldo da Carteira - Pagamento') {
        tipoFinal = 'despesa';
      } else {
        ignoradas++; continue;
      }
      if (jaImportado(origemId)) { ignoradas++; continue; }
      novas.push({
        id: uid(), origemId: origemId, data: data, tipo: tipoFinal,
        descricao: 'Shopee - ' + (descricao || tipoRaw) + (idPedido && idPedido !== '-' ? ' (' + idPedido + ')' : ''),
        valor: Math.abs(valor)
      });
    }
    return { novas: novas, ignoradas: ignoradas };
  }

  function processarArquivo(file, onDone) {
    var nome = file.name.toLowerCase();
    if (nome.endsWith('.json')) {
      var readerJson = new FileReader();
      readerJson.onload = function (e) { onDone(parseApiJson(e.target.result, 'api-ml-', 'Mercado Livre'), 'Mercado Livre (API)'); };
      readerJson.onerror = function () { onDone({ novas: [], ignoradas: 0, erro: true }, '—'); };
      readerJson.readAsText(file);
    } else if (nome.endsWith('.csv')) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var texto = e.target.result;
        if (texto.indexOf('TRANSACTION_TYPE') !== -1) {
          onDone(parseMercadoLivreCsv(texto), 'Mercado Livre');
        } else {
          // tenta como planilha shopee exportada em csv (linhas separadas por vírgula)
          var linhas = texto.split(/\r?\n/).map(function (l) { return l.split(','); });
          onDone(parseShopeeRows(linhas), 'Shopee');
        }
      };
      reader.onerror = function () { onDone({ novas: [], ignoradas: 0, erro: true }, '—'); };
      reader.readAsText(file);
    } else {
      var reader2 = new FileReader();
      reader2.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, { type: 'array' });
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
          onDone(parseShopeeRows(rows), 'Shopee');
        } catch (err) {
          onDone({ novas: [], ignoradas: 0, erro: true }, '—');
        }
      };
      reader2.onerror = function () { onDone({ novas: [], ignoradas: 0, erro: true }, '—'); };
      reader2.readAsArrayBuffer(file);
    }
  }

  // ===================== LEITURA DOS JSON DA AUTOMACAO =====================
  // pedidos_classificados.json (ML) e pedidos_shopee.json: cria ou atualiza as transacoes.

  function parseApiJson(texto, origemPrefix, labelFonte) {
    origemPrefix = origemPrefix || 'api-ml-';
    labelFonte = labelFonte || 'Mercado Livre';
    var novas = [];
    var ignoradas = 0;
    var atualizadas = 0;
    var dados;
    try { dados = JSON.parse(texto); } catch (e) { return { novas: [], ignoradas: 0, atualizadas: 0, erro: true }; }
    if (!Array.isArray(dados)) return { novas: [], ignoradas: 0, atualizadas: 0, erro: true };
    dados.forEach(function (item, i) {
      var tipo = item.tipo;
      var valor = parseFloat(item.valor);
      var dataRaw = String(item.data || '').trim();
      if (!dataRaw || isNaN(valor) || ['venda', 'compra', 'despesa', 'devolucao', 'cancelamento', 'reembolso'].indexOf(tipo) === -1) {
        ignoradas++; return;
      }
      var data = dataRaw.split('T')[0];
      // Horario da venda (para o mapa de calor), no fuso de quem abre o painel
      var quando = dataRaw.indexOf('T') !== -1 ? new Date(dataRaw) : null;
      var temHora = quando && !isNaN(quando.getTime());
      var origemId = origemPrefix + item.id + '-' + tipo;
      var existente = state.transacoes.find(function (t) { return t.origemId === origemId; });
      // Venda que depois foi cancelada: vira cancelamento (senão contaria a venda e o cancelamento)
      if (!existente && tipo === 'cancelamento') {
        var vendaAntes = state.transacoes.find(function (t) { return t.origemId === origemPrefix + item.id + '-venda'; });
        if (vendaAntes) {
          vendaAntes.tipo = 'cancelamento';
          vendaAntes.origemId = origemId;
          // os itens ficam: se o dinheiro ficou com o vendedor (relatorio de liberacoes), conta como venda
          if (Array.isArray(item.itens)) vendaAntes.itens = item.itens;
          delete vendaAntes.custosMl; delete vendaAntes.custosShopee;
          atualizadas++;
          return;
        }
      }
      if (existente) {
        var mudou = false;
        if (tipo === 'cancelamento' && Array.isArray(item.itens) && !Array.isArray(existente.itens)) {
          existente.itens = item.itens;
          mudou = true;
        }
        if (tipo === 'venda' && Array.isArray(item.itens) && (!Array.isArray(existente.itens) || ((item.custos_ml || item.custos_shopee) && JSON.stringify(existente.itens) !== JSON.stringify(item.itens)))) {
          existente.itens = item.itens;
          mudou = true;
        }
        if (tipo === 'venda' && item.custos_ml && JSON.stringify(existente.custosMl || null) !== JSON.stringify(item.custos_ml)) {
          existente.custosMl = item.custos_ml;
          mudou = true;
        }
        if (tipo === 'venda' && item.custos_shopee && JSON.stringify(existente.custosShopee || null) !== JSON.stringify(item.custos_shopee)) {
          existente.custosShopee = item.custos_shopee;
          mudou = true;
        }
        if (item.status && existente.status !== item.status) { existente.status = item.status; mudou = true; }
        if (temHora && existente.hora === undefined) {
          existente.hora = quando.getHours(); existente.dow = quando.getDay(); existente.dataHora = quando.toISOString();
          mudou = true;
        }
        if (mudou) atualizadas++; else ignoradas++;
        return;
      }
      var transacaoNova = {
        id: uid(), origemId: origemId, data: data, tipo: tipo,
        descricao: labelFonte + ' (API) - pedido ' + item.id,
        valor: Math.abs(valor)
      };
      if ((tipo === 'venda' || tipo === 'cancelamento') && Array.isArray(item.itens)) {
        transacaoNova.itens = item.itens;
      }
      if (item.status) transacaoNova.status = item.status;   // Shopee: pedido concluido ou nao (previsao de caixa)
      if (temHora) { transacaoNova.hora = quando.getHours(); transacaoNova.dow = quando.getDay(); transacaoNova.dataHora = quando.toISOString(); }
      if (tipo === 'venda' && item.custos_ml) {
        transacaoNova.custosMl = item.custos_ml;
      }
      if (tipo === 'venda' && item.custos_shopee) {
        transacaoNova.custosShopee = item.custos_shopee;
      }
      novas.push(transacaoNova);
    });
    return { novas: novas, ignoradas: ignoradas, atualizadas: atualizadas };
  }

  // ---------- Intro ----------
  function mostrarIntro() {
    var reduzir = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var intro = document.createElement('div');
    intro.id = 'intro';
    intro.setAttribute('role', 'dialog');
    intro.setAttribute('aria-label', 'Boas-vindas');
    var canvas = document.createElement('canvas');
    intro.appendChild(canvas);
    var texto = document.createElement('div');
    texto.className = 'intro-texto';
    texto.innerHTML = '<div class="intro-ola"></div><div class="intro-sub"></div>';
    texto.querySelector('.intro-ola').textContent = saudacao() + ', ' + NOME_DONO;
    texto.querySelector('.intro-sub').textContent = 'Seu painel da ' + NOME_LOJA + ' está pronto.';
    intro.appendChild(texto);
    var pular = document.createElement('button');
    pular.className = 'intro-pular';
    pular.textContent = 'Pular';
    intro.appendChild(pular);
    document.body.appendChild(intro);

    var encerrado = false;
    var raf = null;
    function encerrar() {
      if (encerrado) return;
      encerrado = true;
      intro.classList.add('saindo');
      setTimeout(function () { if (raf) cancelAnimationFrame(raf); intro.remove(); }, 950);
      document.removeEventListener('keydown', encerrar);
    }
    intro.addEventListener('click', encerrar);
    document.addEventListener('keydown', encerrar);

    if (reduzir) {
      intro.classList.add('mostrar-texto');
      setTimeout(encerrar, 1800);
      return;
    }

    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W, H;
    function medir() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    medir();

    // Pontos do nome da loja: desenha o texto fora da tela e amostra os pixels
    var off = document.createElement('canvas');
    var oc = off.getContext('2d');
    var cores = ['#9466FF', '#7A5CFF', '#4F6BFF', '#3D8BFF', '#22B8F0'];
    var particulas = [], ox = 0, oy = 0, passo = 4;
    function construirAlvos() {
      var maxLarg = Math.min(W * 0.86, 1150);
      var tam = 160;
      oc.font = '800 ' + tam + 'px Sora, Manrope, sans-serif';
      var larg = oc.measureText('TOP BRASIL SHOP').width;
      tam = Math.max(26, Math.min(150, tam * maxLarg / larg));
      off.width = Math.ceil(maxLarg + 40); off.height = Math.ceil(tam * 1.5);
      oc.clearRect(0, 0, off.width, off.height);
      oc.fillStyle = '#fff'; oc.textAlign = 'center'; oc.textBaseline = 'middle';
      oc.font = '800 ' + tam + 'px Sora, Manrope, sans-serif';
      oc.fillText('TOP BRASIL SHOP', off.width / 2, off.height / 2);
      var dados = oc.getImageData(0, 0, off.width, off.height).data;
      passo = Math.max(3, Math.round(tam / 24));
      var alvos = [];
      for (var y = 0; y < off.height; y += passo) {
        for (var x = 0; x < off.width; x += passo) {
          if (dados[(y * off.width + x) * 4 + 3] > 140) alvos.push([x, y]);
        }
      }
      ox = (W - off.width) / 2; oy = H * 0.40 - off.height / 2;
      particulas = alvos.map(function (a) {
        var ang = Math.random() * Math.PI * 2;
        var raio = Math.max(W, H) * (0.6 + Math.random() * 0.6);
        var pos = a[0] / off.width;
        return {
          x: W / 2 + Math.cos(ang) * raio, y: H / 2 + Math.sin(ang) * raio,
          tx: ox + a[0], ty: oy + a[1],
          atraso: pos * 520 + Math.random() * 380,
          cor: cores[Math.min(cores.length - 1, Math.floor(pos * cores.length))],
          r: passo * (0.30 + Math.random() * 0.16),
          fase: Math.random() * Math.PI * 2
        };
      });
    }
    var estrelas = [];
    for (var s = 0; s < 160; s++) estrelas.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random(), v: 0.05 + Math.random() * 0.25 });

    var inicio = performance.now();
    var DUR = 1700;
    function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

    function quadro(agora) {
      var t = agora - inicio;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(7,5,26,0.34)';
      ctx.fillRect(0, 0, W, H);

      // brilho de fundo
      var g = ctx.createRadialGradient(W / 2, H * 0.42, 10, W / 2, H * 0.42, Math.max(W, H) * 0.6);
      g.addColorStop(0, 'rgba(109,61,240,' + (0.10 + 0.06 * Math.sin(t / 900)) + ')');
      g.addColorStop(1, 'rgba(7,5,26,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      // estrelas
      for (var i = 0; i < estrelas.length; i++) {
        var e = estrelas[i];
        e.y -= e.v; if (e.y < 0) { e.y = H; e.x = Math.random() * W; }
        ctx.fillStyle = 'rgba(180,170,255,' + (0.15 + e.z * 0.45) + ')';
        ctx.fillRect(e.x, e.y, 1 + e.z, 1 + e.z);
      }

      ctx.globalCompositeOperation = 'lighter';
      var tvar = t - (DUR + 700);
      for (var k = 0; k < particulas.length; k++) {
        var p = particulas[k];
        var prog = Math.max(0, Math.min(1, (t - p.atraso) / DUR));
        var ep = easeOut(prog);
        var tremor = prog >= 1 ? Math.sin(t / 380 + p.fase) * 0.7 : 0;
        var px = p.x + (p.tx - p.x) * ep + tremor;
        var py = p.y + (p.ty - p.y) * ep + Math.cos(t / 420 + p.fase) * (prog >= 1 ? 0.7 : 0);
        var brilho = 0;
        if (tvar > 0 && tvar < 1200) { var dx = Math.abs(px - (ox - 150 + (off.width + 300) * (tvar / 1200))); if (dx < 110) brilho = 1 - dx / 110; }
        ctx.fillStyle = brilho > 0.35 ? '#FFFFFF' : p.cor;
        ctx.globalAlpha = Math.min(1, 0.25 + 0.55 * ep + brilho * 0.5);
        ctx.beginPath(); ctx.arc(px, py, p.r * (1.6 - 0.6 * ep) * (1 + brilho * 0.5), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (t > DUR + 500 && !intro.classList.contains('mostrar-texto')) intro.classList.add('mostrar-texto');
      if (t > DUR + 3300) encerrar();
      if (!encerrado || t < DUR + 4300) raf = requestAnimationFrame(quadro);
    }
    // espera a fonte carregar para o nome sair na fonte certa
    var comecou = false;
    var comecar = function () { if (comecou) return; comecou = true; construirAlvos(); inicio = performance.now(); raf = requestAnimationFrame(quadro); };
    if (document.fonts && document.fonts.load) {
      document.fonts.load('800 80px Sora').then(comecar, comecar);
      setTimeout(comecar, 900);
    } else { comecar(); }
    window.addEventListener('resize', medir);
  }

  // ---------- Graficos ----------
  function destruirGraficos() {
    graficosAtivos.forEach(function (g) { try { g.destroy(); } catch (e) {} });
    graficosAtivos = [];

  function opcoesBaseGrafico() {

          padding: 12, cornerRadius: 10, boxPadding: 4, usePointStyle: true,

  function novoGrafico(canvas, config) {
    if (typeof Chart === 'undefined') {
      canvas.parentNode.appendChild(el('div', { class: 'pml-empty', text: 'Não consegui carregar os gráficos. Confira sua internet e recarregue a página.' }));
      canvas.remove();
      return null;
    }
    var g = new Chart(canvas.getContext('2d'), config);
    graficosAtivos.push(g);
    return g;
  }

  // ---------- Dados do inicio ----------
  function dadosInicio() {
    var hoje = hojeStr(0), ontem = hojeStr(-1);
    var inicio30 = hojeStr(-29);
    var mesAtual = hoje.slice(0, 7);
    var r = { hoje: { total: 0, pedidos: 0, plat: {} }, ontem: { total: 0 }, mes: { total: 0, pedidos: 0 }, dias: {}, plat30: {}, total30: 0 };
    for (var i = 0; i < 30; i++) r.dias[hojeStr(-29 + i)] = { ml: 0, shopee: 0, tiktok: 0, outro: 0 };
    state.transacoes.forEach(function (t) {
      if (t.tipo !== 'venda') return;
      var v = Number(t.valor) || 0;
      var p = plataformaDe(t);
      if (t.data === hoje) { r.hoje.total += v; r.hoje.pedidos++; r.hoje.plat[p] = (r.hoje.plat[p] || 0) + v; }
      if (t.data === ontem) r.ontem.total += v;
      if ((t.data || '').slice(0, 7) === mesAtual) { r.mes.total += v; r.mes.pedidos++; }
      if (t.data >= inicio30 && r.dias[t.data]) { r.dias[t.data][p] += v; r.plat30[p] = (r.plat30[p] || 0) + v; r.total30 += v; }
    });
    return r;
  }

  function renderInicio(wrap) {
    destruirGraficos();
    var d = dadosInicio();
    var lucro = calcLucroPorProduto(30);
    var tot = lucro.linhas.reduce(function (a, g) {
      a.receita += g.receita; a.liquido += g.liquido;
      if (g.lucro !== null) { a.lucro += g.lucro; a.receitaComCusto += g.receita; }
      return a;
    }, { receita: 0, liquido: 0, lucro: 0, receitaComCusto: 0 });
    var levou = tot.receita ? 1 - tot.liquido / tot.receita : null;
    function ficouCom(p) {
      var t = lucro.linhas.filter(function (g) { return g.plataforma === p; }).reduce(function (a, g) { a.r += g.receita; a.l += g.liquido; return a; }, { r: 0, l: 0 });
      return t.r ? 1 - t.l / t.r : null;
    }
    var ficouMl = ficouCom('ml'), ficouShopee = ficouCom('shopee');
    var ads30 = adsShopeeNoPeriodo(30);
    // So desconta o Ads quando ja existe custo cadastrado em algum produto da Shopee,
    // senao o lucro ficaria negativo sem os produtos que o Ads ajudou a vender.
    var shopeeComCusto = lucro.linhas.some(function (g) { return g.plataforma === 'shopee' && g.lucro !== null; });
    var adsDesc = shopeeComCusto && ads30 ? ads30.gasto : 0;

    // Saudacao
    var agora = new Date();
    var dataLonga = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    var horas = horasDesdeAtualizacaoAutomacao();
    var sau = el('div', { class: 'ini-saudacao' }, [
      el('div', {}, [
        el('h1', { text: saudacao(agora) + ', ' + NOME_DONO }),

      ]),
      el('div', { class: 'ini-atualizado' }, [
        el('span', { class: 'ini-pulso' + (horas !== null && horas > 6 ? ' parado' : '') }),
        el('span', { text: horas === null ? 'Aguardando a automação' : (horas > 6 ? 'Automação parada há ' + Math.round(horas) + ' h' : 'Dados atualizados automaticamente') })
      ])
    ]);
    wrap.appendChild(sau);
    renderAvisos(wrap);

    var grid = el('div', { class: 'ini-grid' });

    // Hoje

      el('div', { class: 'linha' }, [
        el('div', {}, [el('b', { text: String(d.hoje.pedidos) }), el('span', { text: d.hoje.pedidos === 1 ? 'pedido' : 'pedidos' })]),
        el('div', {}, [el('b', { text: fmtMoney(ticketHoje) }), el('span', { text: 'ticket médio' })]),
        el('div', {}, [el('b', { text: fmtMoney(d.hoje.plat.ml || 0) }), el('span', { text: 'Mercado Livre' })]),
        el('div', {}, [el('b', { text: fmtMoney(d.hoje.plat.shopee || 0) }), el('span', { text: 'Shopee' })])
      ])
    ]);
    grid.appendChild(hojeCard);

    // Mes
    var nomeMes = agora.toLocaleDateString('pt-BR', { month: 'long' });
    function kpi(rotulo, num, sub, classe) {
      return el('div', { class: 'ini-kpi' }, [el('div', { class: 'rotulo', text: rotulo }), el('div', { class: 'num' + (classe ? ' ' + classe : ''), text: num }), el('div', { class: 'sub', text: sub })]);
    }
    var mes = el('div', { class: 'ini-mes' }, [
      kpi('Faturamento de ' + nomeMes, fmtMoney(d.mes.total), d.mes.pedidos + ' pedidos · ticket ' + fmtMoney(d.mes.pedidos ? d.mes.total / d.mes.pedidos : 0)),
      kpi('Lucro real (30 dias)', fmtMoney(tot.lucro - adsDesc), tot.receitaComCusto ? 'margem de ' + fmtPct((tot.lucro - adsDesc) / tot.receitaComCusto) + ', já sem imposto' + (adsDesc ? ' e sem o Ads da Shopee' : '') : 'cadastre os custos na aba Lucro real', (tot.lucro - adsDesc) >= 0 ? 'pos' : 'neg'),
      kpi('As plataformas ficaram com', levou === null ? '—' : fmtPct(levou), 'ML ' + fmtPct(ficouMl) + ' · Shopee ' + fmtPct(ficouShopee) + ' das vendas, antes do Ads'),
      kpi('Shopee Ads (30 dias)', ads30 ? fmtMoney(ads30.gasto) : '—', ads30 ? 'trouxe ' + fmtMoney(ads30.vendas) + ' em vendas (' + fmtPct(ads30.vendas ? ads30.gasto / ads30.vendas : null) + ' gasto)' : 'chega pela automação da Shopee')
    ]);
    grid.appendChild(mes);
    var lucroMesCalc = calcLucroPorProduto(agora.getDate()).linhas.reduce(function (s, g) { return g.lucro !== null ? s + g.lucro : s; }, 0);
    grid.appendChild(blocoMetas(d, lucroMesCalc));
    renderVendasDoDia(grid);
    var escWrap = el('section', { class: 'ini-bloco ini-c12' });
    renderEscadaCard(escWrap, isoHoje(0).slice(0, 8) + '01', isoHoje(0), 'Este mês: do faturamento ao seu bolso');
    grid.appendChild(escWrap);
    var caixaWrap = el('section', { class: 'ini-bloco ini-c12' });
    renderCaixaCard(caixaWrap);
    grid.appendChild(caixaWrap);

    // Grafico diario por plataforma
    var plats = ['ml', 'shopee', 'tiktok', 'outro'].filter(function (p) { return (d.plat30[p] || 0) > 0; });
    var corDe = { ml: cssVar('--s-ml'), shopee: cssVar('--s-shopee'), tiktok: cssVar('--s-tiktok'), outro: cssVar('--muted') };
    var diasLista = Object.keys(d.dias).sort();
    var blocoDia = el('section', { class: 'ini-bloco ini-c8' });
    var legenda = el('div', { class: 'ini-legenda' }, plats.map(function (p) { return el('span', {}, [el('i', { style: 'background:' + corDe[p] }), document.createTextNode(NOMES_PLAT[p])]); }));
    var tabelaWrap = el('div', { style: 'display:none; margin-top:12px; max-height:240px; overflow:auto;' });
    var btnTabela = el('button', { class: 'ini-ver-tabela', text: 'Ver como tabela', onclick: function () {

      tabelaWrap.style.display = aberto ? 'none' : 'block';
      btnTabela.textContent = aberto ? 'Ver como tabela' : 'Esconder tabela';

    blocoDia.appendChild(el('div', { class: 'cab' }, [el('h3', { text: 'Faturamento por dia' }), el('div', { style: 'display:flex; gap:16px; align-items:center; flex-wrap:wrap;' }, [legenda, btnTabela])]));
    var cvDia = el('canvas', { role: 'img', 'aria-label': 'Faturamento por dia nos últimos 30 dias, por plataforma' });
    blocoDia.appendChild(el('div', { class: 'ini-grafico' }, [cvDia]));
    var tb = el('table', { class: 'pml-table' });
    tb.appendChild(el('tr', {}, [el('th', { text: 'Dia' })].concat(plats.map(function (p) { return el('th', { class: 'num', text: NOMES_PLAT[p] }); }))));
    diasLista.slice().reverse().forEach(function (dia) {
      tb.appendChild(el('tr', {}, [el('td', { text: dia.slice(8, 10) + '/' + dia.slice(5, 7) })].concat(plats.map(function (p) { return el('td', { class: 'num', text: fmtMoney(d.dias[dia][p]) }); }))));
    });
    tabelaWrap.appendChild(tb);
    blocoDia.appendChild(tabelaWrap);
    grid.appendChild(blocoDia);

    // Rosca por plataforma
    var blocoPlat = el('section', { class: 'ini-bloco ini-c4' });
    blocoPlat.appendChild(el('div', { class: 'cab' }, [el('h3', { text: 'Onde você mais vende' })]));
    var cvPlat = el('canvas', { role: 'img', 'aria-label': 'Divisão do faturamento por plataforma em 30 dias' });
    blocoPlat.appendChild(el('div', { class: 'ini-grafico baixo' }, [cvPlat]));
    var mini = el('table', { class: 'ini-tabela-mini' });
    plats.forEach(function (p) {
      mini.appendChild(el('tr', {}, [
        el('td', {}, [el('i', { style: 'display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:8px; background:' + corDe[p] }), document.createTextNode(NOMES_PLAT[p])]),
        el('td', { text: fmtMoney(d.plat30[p]) + ' (' + fmtPct(d.total30 ? d.plat30[p] / d.total30 : 0) + ')' })
      ]));
    });
    blocoPlat.appendChild(mini);
    grid.appendChild(blocoPlat);

    // Ranking de lucro
    var comLucro = lucro.linhas.filter(function (g) { return g.lucro !== null; }).sort(function (a, b) { return b.lucro - a.lucro; });
    var ranking = comLucro.slice(0, 6).concat(comLucro.filter(function (g) { return g.lucro < 0; }).filter(function (g) { return comLucro.indexOf(g) >= 6; }));
    var blocoRank = el('section', { class: 'ini-bloco ini-c6' });
    blocoRank.appendChild(el('div', { class: 'cab' }, [el('h3', { text: 'Quem mais dá lucro (30 dias)' }), el('button', { class: 'ini-ver-tabela', text: 'Abrir Lucro real', onclick: function () { state.tab = 'lucro'; render(); } })]));
    var cvRank = null;

    var alertas = [];
    comLucro.filter(function (g) { return g.lucro < 0; }).forEach(function (g) {
      alertas.push(['bad', '🔻', g.titulo, 'Perdendo ' + fmtMoney(-g.lucroUnit) + ' por unidade. Reveja o preço ou pare de comprar acima de ' + fmtMoney(Math.max(0, g.maxCompra)) + '.']);
    });
    comLucro.filter(function (g) { return g.lucro >= 0 && g.margem !== null && g.margem < 0.08; }).slice(0, 3).forEach(function (g) {
      alertas.push(['warn', '⚠️', g.titulo, 'Margem de só ' + fmtPct(g.margem) + '.']);
    });
    if (ficouShopee !== null && ficouShopee > 0.35) alertas.push(['warn', '🧾', 'A Shopee ficou com ' + fmtPct(ficouShopee) + ' das suas vendas', 'Comissão, taxa fixa por pedido e afiliados pesam muito em peças baratas. Veja o simulador da Calculadora 3D.']);
    var semCusto = lucro.linhas.filter(function (g) { return g.custoUnit === null; }).length;
    if (semCusto) alertas.push(['warn', '✏️', semCusto + ' produto(s) sem custo cadastrado', 'Sem o custo, o lucro deles não entra na conta.']);
    if (state.faturamento && state.faturamento.periodos) {

      if (per) {

        if (ant > 0) alertas.push(['warn', '💸', 'Antecipação do Mercado Pago: ' + fmtMoney(ant), 'Foi o que você pagou na última fatura para receber antes do prazo.']);
      }
    }
    if (horas !== null && horas > 6) alertas.unshift(['bad', '⛔', 'A automação não atualiza há ' + Math.round(horas) + ' horas', 'Confira o GitHub Actions.']);
    if (!alertas.length) alertas.push(['good', '✅', 'Tudo em ordem', 'Nenhum produto com prejuízo nos últimos 30 dias.']);

  function plataformasPadrao() {
    return [
      { id: 'shopee', nome: 'Shopee', comissao: 20, taxaFixa: 4.5, frete: 0, ads: 15.5, nota: 'Nas suas vendas reais: cerca de 18,6% de comissão + 1,4% de serviço + R$ 4,50 fixos por pedido. Afiliados cobram à parte quando a venda vem deles.' },
      { id: 'ml', nome: 'Mercado Livre', comissao: 12, taxaFixa: 6.5, frete: 5, ads: 0, nota: 'Abaixo de R$ 79 o ML cobra tarifa por unidade e frete por peso — use os números reais da aba Lucro real.' },
      { id: 'tiktok', nome: 'TikTok Shop', comissao: 10, taxaFixa: 4, frete: 0, ads: 0, nota: 'Abaixo de R$ 50: 10% + R$ 4 por item (desde 15/07/2026).' }
    ];
  }

  function calc3dPadrao() {
    return {
      kwh: 0.95,              // R$ por kWh da conta de luz
      perdaPct: 8,            // % de pecas perdidas/falhas
      manutencaoHora: 0.30,   // R$ por hora de impressao (bico, mesa, correia...)
      impressoras: [{ id: 'imp1', nome: 'Minha impressora', watts: 150, preco: 2500, vidaHoras: 5000 }],
      filamentos: [],         // lotes: {id, data, tipo, descricao, kg, preco, frete}
      embalagens: [],         // lotes: {id, data, nome, qtd, preco, frete}
      produtos: [],           // {id, nome, tipo, gramas, horas, porPlaca, impressoraId, embalagem, extras, anuncios}
      imposto: 4,
      plataformas: plataformasPadrao()
    };
  }

  function getCalc3d() {
    if (!state.calc3d) state.calc3d = calc3dPadrao();
    var c = state.calc3d;
    if (!Array.isArray(c.plataformas)) c.plataformas = plataformasPadrao();
    if (c.imposto === undefined) c.imposto = (c.simulador && c.simulador.imposto !== undefined) ? c.simulador.imposto : 4;
    c.produtos.forEach(function (p) {
      if (!Array.isArray(p.insumos)) {
        p.insumos = p.embalagem ? [{ nome: p.embalagem, qtd: 1 }] : [];
        delete p.embalagem;
      }
      if (!p.precos) p.precos = p.precoVenda ? { shopee: p.precoVenda } : {};
    });
    return c;
  }

  async function salvarCalc3d() {
    try { await window.storage.set('ml-calc3d', JSON.stringify(state.calc3d)); } catch (e) {}
  }

  function num(v) { var n = Number(String(v === undefined || v === null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; }

  // Preco das compras do periodo, nao a media de todo o historico: o vendedor vai barateando
  // as compras. Para uma data (a da venda), vale a compra mais recente feita ate aquele dia e
  // as outras feitas ate 30 dias antes dela. Sem data: o preco de hoje. Venda anterior a
  // primeira compra cadastrada usa a primeira compra. Lotes sem data entram todos.
  function lotesDoPeriodo(lotes, dataRef) {
    var comData = lotes.filter(function (l) { return l.data; });
    if (!comData.length) return lotes;
    var ate = comData.filter(function (l) { return !dataRef || l.data <= dataRef; });
    if (!ate.length) {
      var primeira = comData.map(function (l) { return l.data; }).sort()[0];
      ate = comData.filter(function (l) { return l.data <= primeira; });
    }
    var ultima = ate.map(function (l) { return l.data; }).sort().pop();
    var corte = new Date(new Date(ultima + 'T12:00:00').getTime() - 30 * 86400000).toISOString().slice(0, 10);
    return ate.filter(function (l) { return l.data >= corte; });
  }
  var lotesAtuais = lotesDoPeriodo;

  function precoMedioLotes(lotes, campoQtd, fator) {
    var qtd = lotes.reduce(function (s, l) { return s + num(l[campoQtd]) * fator; }, 0);
    var pago = lotes.reduce(function (s, l) { return s + num(l.preco) + num(l.frete); }, 0);
    return qtd > 0 ? pago / qtd : 0;
  }

  function custoGrama(tipo, dataRef) {
    var c = getCalc3d();
    var lotes = c.filamentos.filter(function (l) { return (l.tipo || '').toUpperCase() === (tipo || '').toUpperCase(); });
    var peps = precoFifo('fil:' + String(tipo || '').toUpperCase(), dataRef);
    if (peps !== null) return peps;
    if (!lotes.length) lotes = c.filamentos;
    return precoMedioLotes(lotesDoPeriodo(lotes, dataRef), 'kg', 1000);
  }

  function custoEmbalagem(nome, dataRef) {
    var c = getCalc3d();
    var peps = precoFifo('emb:' + nome, dataRef);
    if (peps !== null) return peps;
    return precoMedioLotes(lotesDoPeriodo(c.embalagens.filter(function (l) { return l.nome === nome; }), dataRef), 'qtd', 1);
  }

  function tiposFilamento() {
    var t = {};
    getCalc3d().filamentos.forEach(function (l) { if (l.tipo) t[l.tipo.toUpperCase()] = true; });
    var lista = Object.keys(t);
    return lista.length ? lista : ['PLA'];
  }

  function nomesEmbalagem() {
    var t = {};
    getCalc3d().embalagens.forEach(function (l) { if (l.nome) t[l.nome] = true; });
    return Object.keys(t);
  }

  function custoPeca3d(p, dataRef) {
    var c = getCalc3d();
    var imp = c.impressoras.find(function (i) { return i.id === p.impressoraId; }) || c.impressoras[0] || { watts: 0, preco: 0, vidaHoras: 1 };
    var porPlaca = Math.max(1, num(p.porPlaca) || 1);
    var horas = num(p.horas);
    var material = num(p.gramas) * custoGrama(p.tipo, dataRef);
    var energia = horas * (num(imp.watts) / 1000) * num(c.kwh);
    var desgaste = horas * (num(imp.vidaHoras) > 0 ? num(imp.preco) / num(imp.vidaHoras) : 0);
    var manutencao = horas * num(c.manutencaoHora);
    var porPeca = (material + energia + desgaste + manutencao) / porPlaca;
    var perda = porPeca * num(c.perdaPct) / 100;
    var emb = (p.insumos || []).reduce(function (s, i) { return s + custoEmbalagem(i.nome, dataRef) * num(i.qtd); }, 0);
    var extras = num(p.extras);
    return {
      material: material / porPlaca, energia: energia / porPlaca, desgaste: desgaste / porPlaca,
      manutencao: manutencao / porPlaca, perda: perda, embalagem: emb, extras: extras,
      total: porPeca + perda + emb + extras
    };
  }

  // Custo de um anuncio vindo da calculadora 3D (usado pela aba Lucro real)
  function custo3dDoAnuncio(itemId, dataRef) {
    var id = String(itemId || '').trim().toUpperCase();
    if (!id || !state.calc3d) return null;
    var p = state.calc3d.produtos.find(function (x) {
      return String(x.anuncios || '').toUpperCase().split(/[\s,;]+/).indexOf(id) !== -1;
    });
    if (!p || !(num(p.gramas) > 0) || !(num(p.horas) > 0)) return null;  // peca ainda sem gramas/horas
    return custoPeca3d(p, dataRef).total;
  }

  // Taxas reais de uma venda, vindas da automacao (ML ou Shopee). null = sem dados.

  // Junta as vendas dos ultimos N dias por anuncio e calcula o lucro real de cada um.

    state.transacoes.forEach(function (t) {

      if ((t.tipo !== 'venda' && !ficou) || !Array.isArray(t.itens) || t.data < limiteStr || (ateStr && t.data > ateStr)) return;

  // ===================== METAS, MAPA DE CALOR E BACKUP =====================

  var DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  var DIAS_CURTOS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  // Projecao simples: o ritmo de vendas ate agora, estendido ate o fim do mes.
  function calcProjecaoMes(totalAteAgora, agora) {
    agora = agora || new Date();
    var diasNoMes = new Date(agora.getFullYear(), agora.getMonth() + 1, 0).getDate();
    var decorrido = (agora.getDate() - 1) + (agora.getHours() + agora.getMinutes() / 60) / 24;
    var diasRestantes = Math.max(0, diasNoMes - decorrido);
    // Nas primeiras horas do mes o ritmo ainda nao diz nada
    if (decorrido < 1) return { diasNoMes: diasNoMes, decorrido: decorrido, diasRestantes: diasRestantes, projecao: null };
    return { diasNoMes: diasNoMes, decorrido: decorrido, diasRestantes: diasRestantes, projecao: totalAteAgora / decorrido * diasNoMes };
  }

  // Quantas vendas e quanto faturou em cada dia da semana x hora (ultimos N dias).
  function calcMapaCalor(transacoes, dias, agora) {
    agora = agora || new Date();
    var limite = new Date(agora.getTime() - dias * 864e5);
    var matriz = [];
    for (var d = 0; d < 7; d++) { matriz.push([]); for (var h = 0; h < 24; h++) matriz[d].push({ pedidos: 0, valor: 0 }); }
    var total = 0, semHora = 0, max = 0, melhor = null;
    transacoes.forEach(function (t) {
      if (t.tipo !== 'venda') return;
      if (typeof t.hora !== 'number' || typeof t.dow !== 'number') {
        if (t.data && new Date(t.data + 'T12:00:00') >= limite) semHora++;
        return;
      }
      if (t.dataHora && new Date(t.dataHora) < limite) return;
      var c = matriz[t.dow][t.hora];
      c.pedidos++; c.valor += Number(t.valor) || 0; total++;
      if (c.pedidos > max) { max = c.pedidos; melhor = { dow: t.dow, hora: t.hora }; }
    });
    var porHora = []; for (var hh = 0; hh < 24; hh++) porHora.push(matriz.reduce(function (s, linha) { return s + linha[hh].pedidos; }, 0));
    var porDia = matriz.map(function (linha) { return linha.reduce(function (s, c) { return s + c.pedidos; }, 0); });
    return { matriz: matriz, total: total, semHora: semHora, max: max, melhor: melhor, porHora: porHora, porDia: porDia };
  }

  // Melhor faixa de 3 horas seguidas (somando todos os dias)
  function melhorFaixa(porHora) {
    var melhor = 0, inicio = 0;
    for (var h = 0; h < 24; h++) {
      var s = porHora[h] + porHora[(h + 1) % 24] + porHora[(h + 2) % 24];
      if (s > melhor) { melhor = s; inicio = h; }
    }
    return { inicio: inicio, fim: (inicio + 3) % 24, pedidos: melhor };
  }

    cab.appendChild(el('button', { class: 'ini-ver-tabela', text: 'Mudar meta', onclick: function () { state.editandoMeta = true; render(); } }));
    function barra(rotulo, atual, alvo, projetado) {

      if (pctProj !== null) trilho.appendChild(el('span', { class: 'meta-proj', style: 'width:' + Math.min(100, pctProj * 100).toFixed(1) + '%' }));
      trilho.appendChild(el('span', { class: 'meta-feito', style: 'width:' + Math.min(100, pct * 100).toFixed(1) + '%' }));
      linha.appendChild(trilho);
      var txt;
      if (pct >= 1) txt = '🎉 Meta batida! ' + fmtPct(pct) + ' do objetivo.';
      else if (projetado === null) txt = fmtPct(pct) + ' do objetivo. A projeção aparece a partir do segundo dia do mês.';
      else {

        txt = (projetado >= alvo ? '✅ No ritmo: ' : '⚠️ Abaixo do ritmo: ') + 'a projeção é ' + fmtMoney(projetado) + ' (' + fmtPct(pctProj) + '). Faltam ' + fmtMoney(falta) + ', cerca de ' + fmtMoney(porDia) + ' por dia.';

    if (meta.lucro && lucroMes !== null) {
      var projLucro = proj.projecao !== null && d.mes.total ? lucroMes / d.mes.total * proj.projecao : null;
