<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Mercado Livre e Shopee</title>
</head>
<body>
<div id="app-root">
  <div id="loading-state" style="padding: 3rem 1rem; text-align: center; color: #6B6558; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
    Carregando seu painel...
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  #app-root * { box-sizing: border-box; }
  #app-root {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #FAF7F2;
    color: #22281F;
    min-height: 100vh;
    padding: 0;
  }
  .pml-wrap { max-width: 920px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .pml-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
  .pml-title { font-family: Georgia, 'Iowan Old Style', serif; font-size: 26px; font-weight: 700; margin: 0 0 4px; color: #1B2016; }
  .pml-subtitle { font-size: 14px; color: #6B6558; margin: 0; }
  .pml-tabs { display: flex; gap: 4px; background: #F1ECE2; padding: 4px; border-radius: 10px; margin-bottom: 1.75rem; width: fit-content; }
  .pml-tab { border: none; background: transparent; padding: 8px 18px; font-size: 14px; font-weight: 600; color: #6B6558; border-radius: 7px; cursor: pointer; font-family: inherit; }
  .pml-tab.active { background: #FFFFFF; color: #1B2016; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .pml-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 2rem; }
  .pml-metric { background: #FFFFFF; border: 1px solid #E4DDCF; border-radius: 12px; padding: 16px 18px; }
  .pml-metric-label { font-size: 12px; color: #6B6558; margin: 0 0 6px; }
  .pml-metric-value { font-size: 22px; font-weight: 700; margin: 0; color: #1B2016; }
  .pml-metric-value.pos { color: #2F6E52; }
  .pml-metric-value.neg { color: #B23A2E; }
  .pml-section-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: #1B2016; }
  .pml-card { background: #FFFFFF; border: 1px solid #E4DDCF; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .pml-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .pml-field label { display: block; font-size: 12px; color: #6B6558; margin-bottom: 4px; }
  .pml-field input, .pml-field select { width: 100%; padding: 8px 10px; border: 1px solid #D8D0C0; border-radius: 7px; font-size: 14px; font-family: inherit; background: #FFFDF9; }
  .pml-field input:focus, .pml-field select:focus { outline: none; border-color: #C97A2B; }
  .pml-btn { background: #C97A2B; color: #FFFFFF; border: none; padding: 9px 18px; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .pml-btn:hover { background: #B26A22; }
  .pml-btn.secondary { background: transparent; color: #B23A2E; border: 1px solid #E4DDCF; padding: 5px 10px; font-size: 12px; }
  .pml-btn.secondary:hover { background: #FBEFEC; }
  .pml-error { color: #B23A2E; font-size: 12px; margin: -6px 0 12px; }
  .pml-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pml-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #6B6558; padding: 8px 10px; border-bottom: 1px solid #E4DDCF; }
  .pml-table td { padding: 10px 10px; border-bottom: 1px solid #F1ECE2; }
  .pml-table tr:last-child td { border-bottom: none; }
  .pml-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pml-badge.venda { background: #E1F0E7; color: #2F6E52; }
  .pml-badge.compra { background: #FCEFE2; color: #A15D1B; }
  .pml-badge.despesa { background: #FBEAE7; color: #B23A2E; }
  .pml-badge.devolucao { background: #F2E7F5; color: #7A3E92; }
  .pml-badge.cancelamento { background: #EFEAE0; color: #6B6558; }
  .pml-badge.reembolso { background: #FBEAE7; color: #B23A2E; }
  .pml-empty { text-align: center; padding: 2rem 1rem; color: #6B6558; font-size: 14px; }
  .pml-margin { font-size: 12px; color: #6B6558; }
  .pml-drop { border: 2px dashed #D8D0C0; border-radius: 12px; padding: 28px 20px; text-align: center; background: #FFFDF9; }
  .pml-drop input { display: block; margin: 10px auto 0; }
  .pml-import-summary { background: #F1ECE2; border-radius: 10px; padding: 14px 16px; margin-top: 14px; font-size: 13px; line-height: 1.7; }
  .pml-import-summary b { color: #1B2016; }
  .pml-note { font-size: 12px; color: #6B6558; margin-top: 8px; line-height: 1.6; }
  .pml-tabs { flex-wrap: wrap; max-width: 100%; }
  .pml-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  .pml-table td.num, .pml-table th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pml-tabela-lucro { min-width: 860px; }
  .pml-tabela-lucro td:first-child { min-width: 240px; max-width: 300px; }
  .pml-titulo-prod { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
  .pml-row-alerta td { background: #FDF3F1; }
  .pml-row-atencao td { background: #FFF8EC; }
  .pml-tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 700; margin-left: 6px; vertical-align: 1px; }
  .pml-tag.prejuizo { background: #FBEAE7; color: #B23A2E; }
  .pml-tag.baixa { background: #FCEFE2; color: #A15D1B; }
  .pml-tag.boa { background: #E1F0E7; color: #2F6E52; }
  .pml-custo-input { width: 84px; padding: 4px 6px; border: 1px dashed #C97A2B; border-radius: 6px; font-size: 12px; background: #FFFDF9; font-family: inherit; }
  .pml-filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .pml-filtros .pml-field { flex: 1 1 150px; max-width: 220px; }
  .pml-wrap.largo { max-width: 1200px; }
  .pml-barra { height: 8px; border-radius: 999px; background: #F1ECE2; overflow: hidden; margin-top: 6px; }
  .pml-barra span { display: block; height: 100%; background: #C97A2B; }
  .pml-fat-cat { border-top: 1px solid #F1ECE2; padding: 10px 0; }
  .pml-fat-cat summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; font-size: 14px; list-style: none; }
  .pml-fat-cat summary::-webkit-details-marker { display: none; }
  .pml-fat-linha { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: #6B6558; padding: 4px 0 0 14px; }
  .pml-dica { background: #FFF8EC; border: 1px solid #F3E1C2; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6; color: #5C4A2E; margin-top: 12px; }
</style>

<script>
(function () {
  // Fora do ambiente do Claude (ex: GitHub Pages), window.storage não existe.
  // Este polyfill usa o localStorage do navegador nesse caso, sem mudar o resto do código.
  if (!window.storage) {
    window.storage = {
      get: function (key) {
        var v = localStorage.getItem('pml_' + key);
        return Promise.resolve(v === null ? null : { key: key, value: v });
      },
      set: function (key, value) {
        localStorage.setItem('pml_' + key, value);
        return Promise.resolve({ key: key, value: value });
      }
    };
  }

  var root = document.getElementById('app-root');
  var state = { tab: 'geral', produtos: [], transacoes: [], loaded: false, errorMsg: '', gistUrl: '', gistUrlShopee: '', ultimaSincronizacao: '', ultimaSincronizacaoShopee: '', sincronizando: false, sincronizandoShopee: false, confirmarLimpeza: false, editandoProdutoId: null, ultimaBaixaEstoque: [], faturamento: null, custosAvulsos: {}, configLucro: { imposto: 4, margemAlvo: 25, dias: 30, ordem: 'receita' }, fatPeriodo: '', calc3d: null };

  function fmtMoney(n) {
    var v = Number(n);
    if (isNaN(v)) v = 0;
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  var pilhaUndo = [];
  var pilhaRedo = [];

  function estadoAtualSnapshot() {
    return {
      produtos: JSON.parse(JSON.stringify(state.produtos)),
      transacoes: JSON.parse(JSON.stringify(state.transacoes))
    };
  }

  function salvarSnapshotUndo() {
    pilhaUndo.push(estadoAtualSnapshot());
    if (pilhaUndo.length > 20) pilhaUndo.shift();
    pilhaRedo = [];
  }

  function desfazer() {
    if (pilhaUndo.length === 0) return;
    pilhaRedo.push(estadoAtualSnapshot());
    var anterior = pilhaUndo.pop();
    state.produtos = anterior.produtos;
    state.transacoes = anterior.transacoes;
    saveProdutos();
    saveTransacoes();
    render();
  }

  function refazer() {
    if (pilhaRedo.length === 0) return;
    pilhaUndo.push(estadoAtualSnapshot());
    var proximo = pilhaRedo.pop();
    state.produtos = proximo.produtos;
    state.transacoes = proximo.transacoes;
    saveProdutos();
    saveTransacoes();
    render();
  }

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
      var alvo = e.target;
      var digitando = alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'SELECT' || alvo.tagName === 'TEXTAREA');
      if (!digitando) {
        e.preventDefault();
        if (e.shiftKey) { refazer(); } else { desfazer(); }
      }
    }
  });

  async function loadData() {
    try {
      var p = await window.storage.get('ml-produtos');
      state.produtos = p ? JSON.parse(p.value) : [];
    } catch (e) { state.produtos = []; }
    try {
      var t = await window.storage.get('ml-transacoes');
      state.transacoes = t ? JSON.parse(t.value) : [];
    } catch (e) { state.transacoes = []; }
    try {
      var g = await window.storage.get('ml-gist-url');
      state.gistUrl = g ? g.value : '';
    } catch (e) { state.gistUrl = ''; }
    try {
      var gs = await window.storage.get('ml-gist-url-shopee');
      state.gistUrlShopee = gs ? gs.value : '';
    } catch (e) { state.gistUrlShopee = ''; }
    try {
      var u = await window.storage.get('ml-ultima-sync');
      state.ultimaSincronizacao = u ? u.value : '';
    } catch (e) { state.ultimaSincronizacao = ''; }
    try {
      var us = await window.storage.get('ml-ultima-sync-shopee');
      state.ultimaSincronizacaoShopee = us ? us.value : '';
    } catch (e) { state.ultimaSincronizacaoShopee = ''; }
    try {
      var fa = await window.storage.get('ml-faturamento');
      state.faturamento = fa ? JSON.parse(fa.value) : null;
    } catch (e) { state.faturamento = null; }
    try {
      var ca = await window.storage.get('ml-custos-avulsos');
      state.custosAvulsos = ca ? JSON.parse(ca.value) : {};
    } catch (e) { state.custosAvulsos = {}; }
    try {
      var c3 = await window.storage.get('ml-calc3d');
      if (c3) { var base3 = calc3dPadrao(); var salvo3 = JSON.parse(c3.value); Object.keys(salvo3).forEach(function (k) { base3[k] = salvo3[k]; }); state.calc3d = base3; }
    } catch (e) {}
    try {
      var cl = await window.storage.get('ml-config-lucro');
      if (cl) { var cfg = JSON.parse(cl.value); Object.keys(cfg).forEach(function (k) { state.configLucro[k] = cfg[k]; }); }
    } catch (e) {}
    state.loaded = true;
    render();
    if (state.gistUrl) { sincronizarGist(true); }
    if (state.gistUrlShopee) { sincronizarGistShopee(true); }
  }

  async function salvarGistUrl(url) {
    state.gistUrl = url;
    try { await window.storage.set('ml-gist-url', url); } catch (e) {}
  }

  async function salvarGistUrlShopee(url) {
    state.gistUrlShopee = url;
    try { await window.storage.set('ml-gist-url-shopee', url); } catch (e) {}
  }

  // O link "raw" do Gist pode vir preso a uma versao antiga (/raw/<codigo>/arquivo).
  // Tirando esse codigo, o painel sempre busca a versao mais recente.
  function urlGistAtual(url) {
    return String(url || '').replace(/\/raw\/[0-9a-f]{40}\//, '/raw/');
  }

  function urlArquivoIrmao(url, nomeArquivo) {
    var base = urlGistAtual(url).split('?')[0];
    return base.replace(/[^\/]+$/, nomeArquivo);
  }

  async function sincronizarFaturamento() {
    if (!state.gistUrl) return;
    try {
      var r = await fetch(urlArquivoIrmao(state.gistUrl, 'faturamento.json') + '?_=' + Date.now());
      if (!r.ok) return;
      var dados = await r.json();
      if (dados && Array.isArray(dados.periodos)) {
        state.faturamento = dados;
        try { await window.storage.set('ml-faturamento', JSON.stringify(dados)); } catch (e) {}
      }
    } catch (e) {}
  }

  async function salvarCustosAvulsos() {
    try { await window.storage.set('ml-custos-avulsos', JSON.stringify(state.custosAvulsos)); } catch (e) {}
  }

  async function salvarConfigLucro() {
    try { await window.storage.set('ml-config-lucro', JSON.stringify(state.configLucro)); } catch (e) {}
  }

  async function sincronizarGist(silencioso) {
    if (!state.gistUrl) return;
    state.sincronizando = true;
    if (!silencioso) render();
    try {
      var urlAtual = urlGistAtual(state.gistUrl);
      var resposta = await fetch(urlAtual + (urlAtual.indexOf('?') === -1 ? '?_=' : '&_=') + Date.now());
      var texto = await resposta.text();
      var resultado = parseApiJson(texto, 'api-ml-', 'Mercado Livre');
      if (!resultado.erro && resultado.novas.length > 0) {
        salvarSnapshotUndo();
        state.transacoes = state.transacoes.concat(resultado.novas);
        state.transacoes.sort(function (a, b) { return b.data.localeCompare(a.data); });
        await saveTransacoes();
        var baixas = baixarEstoquePorVendas(resultado.novas);
        if (baixas.length > 0) {
          await saveProdutos();
          state.ultimaBaixaEstoque = baixas;
        }
      } else if (!resultado.erro && resultado.atualizadas > 0) {
        await saveTransacoes();
      }
      await sincronizarFaturamento();
      state.ultimaSincronizacao = new Date().toLocaleString('pt-BR');
      try { await window.storage.set('ml-ultima-sync', state.ultimaSincronizacao); } catch (e) {}
      state.errorMsg = '';
    } catch (e) {
      state.errorMsg = 'Não consegui sincronizar com a nuvem agora. Confere sua internet ou a URL configurada.';
    }
    state.sincronizando = false;
    render();
  }

  async function sincronizarGistShopee(silencioso) {
    if (!state.gistUrlShopee) return;
    state.sincronizandoShopee = true;
    if (!silencioso) render();
    try {
      var urlAtualShopee = urlGistAtual(state.gistUrlShopee);
      var resposta = await fetch(urlAtualShopee + (urlAtualShopee.indexOf('?') === -1 ? '?_=' : '&_=') + Date.now());
      var texto = await resposta.text();
      var resultado = parseApiJson(texto, 'api-shopee-', 'Shopee');
      if (!resultado.erro && resultado.novas.length > 0) {
        salvarSnapshotUndo();
        state.transacoes = state.transacoes.concat(resultado.novas);
        state.transacoes.sort(function (a, b) { return b.data.localeCompare(a.data); });
        await saveTransacoes();
        var baixas = baixarEstoquePorVendas(resultado.novas);
        if (baixas.length > 0) {
          await saveProdutos();
          state.ultimaBaixaEstoque = baixas;
        }
      } else if (!resultado.erro && resultado.atualizadas > 0) {
        await saveTransacoes();
      }
      state.ultimaSincronizacaoShopee = new Date().toLocaleString('pt-BR');
      try { await window.storage.set('ml-ultima-sync-shopee', state.ultimaSincronizacaoShopee); } catch (e) {}
      state.errorMsg = '';
    } catch (e) {
      state.errorMsg = 'Não consegui sincronizar com a Shopee agora. Confere sua internet ou a URL configurada.';
    }
    state.sincronizandoShopee = false;
    render();
  }

  async function saveProdutos() {
    try {
      await window.storage.set('ml-produtos', JSON.stringify(state.produtos));
    } catch (e) { state.errorMsg = 'Não consegui salvar. Tenta de novo.'; render(); }
  }

  async function saveTransacoes() {
    try {
      await window.storage.set('ml-transacoes', JSON.stringify(state.transacoes));
    } catch (e) { state.errorMsg = 'Não consegui salvar. Tenta de novo.'; render(); }
  }

  var NOMES_MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  function calcSeriesMensais() {
    var porMes = {};
    state.transacoes.forEach(function (t) {
      var mesKey = String(t.data).slice(0, 7);
      if (!mesKey || mesKey.length !== 7) return;
      if (!porMes[mesKey]) porMes[mesKey] = { vendas: 0, saidas: 0 };
      if (t.tipo === 'venda') porMes[mesKey].vendas += Number(t.valor) || 0;
      else porMes[mesKey].saidas += Number(t.valor) || 0;
    });
    var chaves = Object.keys(porMes).sort();
    return chaves.map(function (k) {
      var partes = k.split('-');
      var mesIdx = parseInt(partes[1], 10) - 1;
      return { mes: k, label: NOMES_MESES[mesIdx] + '/' + partes[0].slice(2), vendas: porMes[k].vendas, saidas: porMes[k].saidas };
    });
  }

  function renderGraficoVendas(wrap) {
    var serie = calcSeriesMensais();
    var card = el('div', { class: 'pml-card' });
    card.appendChild(el('p', { class: 'pml-section-title', text: 'Vendas por mês' }));
    if (serie.length === 0) {
      card.appendChild(el('div', { class: 'pml-empty', text: 'Ainda não há vendas suficientes para mostrar um gráfico.' }));
      wrap.appendChild(card);
      return;
    }
    var maxValor = Math.max.apply(null, serie.map(function (s) { return Math.max(s.vendas, s.saidas); })) || 1;
    var largura = Math.max(320, serie.length * 90);
    var altura = 220;
    var baseY = altura - 30;
    var alturaUtil = baseY - 20;
    var larguraGrupo = largura / serie.length;

    var svgPartes = [];
    svgPartes.push('<svg viewBox="0 0 ' + largura + ' ' + altura + '" style="width:100%; height:auto; max-width:' + largura + 'px; font-family:inherit;">');
    svgPartes.push('<line x1="0" y1="' + baseY + '" x2="' + largura + '" y2="' + baseY + '" stroke="#E4DDCF" stroke-width="1" />');
    serie.forEach(function (s, i) {
      var cx = i * larguraGrupo + larguraGrupo / 2;
      var barW = Math.min(28, larguraGrupo * 0.28);
      var hVenda = (s.vendas / maxValor) * alturaUtil;
      var hSaida = (s.saidas / maxValor) * alturaUtil;
      var xVenda = cx - barW - 3;
      var xSaida = cx + 3;
      svgPartes.push('<rect x="' + xVenda + '" y="' + (baseY - hVenda) + '" width="' + barW + '" height="' + hVenda + '" fill="#2F6E52" rx="2" />');
      svgPartes.push('<rect x="' + xSaida + '" y="' + (baseY - hSaida) + '" width="' + barW + '" height="' + hSaida + '" fill="#B23A2E" rx="2" />');
      svgPartes.push('<text x="' + cx + '" y="' + (baseY + 16) + '" text-anchor="middle" font-size="11" fill="#6B6558">' + s.label + '</text>');
    });
    svgPartes.push('</svg>');

    var svgWrap = el('div', { style: 'overflow-x:auto;' });
    svgWrap.innerHTML = svgPartes.join('');
    card.appendChild(svgWrap);

    var legenda = el('div', { style: 'display:flex; gap:16px; margin-top:10px; font-size:12px; color:#6B6558;' });
    legenda.innerHTML = '<span><span style="display:inline-block; width:10px; height:10px; background:#2F6E52; border-radius:2px; margin-right:5px;"></span>Vendas</span><span><span style="display:inline-block; width:10px; height:10px; background:#B23A2E; border-radius:2px; margin-right:5px;"></span>Saídas (custos, reembolsos, cancelamentos etc)</span>';
    card.appendChild(legenda);
    wrap.appendChild(card);
  }

  function calcMetrics() {
    var valorEstoque = state.produtos.reduce(function (sum, p) {
      return sum + (Number(p.custo) || 0) * (Number(p.quantidade) || 0);
    }, 0);
    var qtdProdutos = state.produtos.length;

    var now = new Date();
    var mesAtual = now.getMonth();
    var anoAtual = now.getFullYear();
    var entradasMes = 0, saidasMes = 0;
    state.transacoes.forEach(function (t) {
      var d = new Date(t.data + 'T00:00:00');
      if (d.getMonth() === mesAtual && d.getFullYear() === anoAtual) {
        if (t.tipo === 'venda') entradasMes += Number(t.valor) || 0;
        else saidasMes += Number(t.valor) || 0;
      }
      // compra, despesa, devolucao, cancelamento e reembolso contam como saída do mês
    });
    var saldoMes = entradasMes - saidasMes;
    var entradasTotal = 0, saidasTotal = 0;
    state.transacoes.forEach(function (t) {
      if (t.tipo === 'venda') entradasTotal += Number(t.valor) || 0;
      else saidasTotal += Number(t.valor) || 0;
    });
    var saldoTotal = entradasTotal - saidasTotal;
    return { valorEstoque: valorEstoque, qtdProdutos: qtdProdutos, saldoMes: saldoMes, saldoTotal: saldoTotal };
  }

      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(c); });

  function fonteAtrasada(url, ultimaSync) {
    if (!url) return false;
    if (!ultimaSync) return true;
    var partes = ultimaSync.match(/(\d{2})\/(\d{2})\/(\d{4}),?\s+(\d{2}):(\d{2})/);
    if (!partes) return false;
    var dataSync = new Date(partes[3], partes[2] - 1, partes[1], partes[4], partes[5]);
    var horasPassadas = (Date.now() - dataSync.getTime()) / (1000 * 60 * 60);
    return horasPassadas > 48;
  }

  function baixarEstoquePorVendas(novas) {

        }
      });
      t.estoqueAplicado = true;
    });
    return relatorio;
  }

  function parseMercadoLivreCsv(text) {
    var linhas = text.split(/\r?\n/).filter(function (l) { return l.trim().length > 0; });
    if (linhas.length < 2) return { novas: [], ignoradas: 0 };
    var header = linhas[0].split(';');
    var idxTipo = header.indexOf('TRANSACTION_TYPE');
    var idxData = header.indexOf('TRANSACTION_DATE');
    var idxValor = header.indexOf('REAL_AMOUNT');
    var idxSource = header.indexOf('SOURCE_ID');
    if (idxTipo === -1 || idxValor === -1) return { novas: [], ignoradas: 0, erro: true };
    var novas = [];
    var ignoradas = 0;
    for (var i = 1; i < linhas.length; i++) {
      var cols = linhas[i].split(';');
      var tipoRaw = (cols[idxTipo] || '').trim();
      var valor = parseFloat(cols[idxValor]);
      var dataRaw = (cols[idxData] || '').trim();
      var data = dataRaw ? dataRaw.split('T')[0] : '';
      var sourceId = (cols[idxSource] || '').trim();
      var origemId = 'ml-' + sourceId + '-' + tipoRaw + '-' + i;
      if (isNaN(valor) || !data) { continue; }
      var tipoFinal = null;
      if (tipoRaw === 'SETTLEMENT' || tipoRaw === 'SETTLEMENT_SHIPPING') tipoFinal = 'venda';
      else if (tipoRaw === 'REFUND') tipoFinal = 'reembolso';
      else if (tipoRaw === 'DISPUTE') tipoFinal = 'devolucao';
      if (!tipoFinal) { ignoradas++; continue; }
      if (jaImportado(origemId)) { ignoradas++; continue; }
      novas.push({
        id: uid(), origemId: origemId, data: data, tipo: tipoFinal,
        descricao: 'Mercado Livre - pedido ' + sourceId + ' (' + tipoRaw + ')',
        valor: Math.abs(valor)
      });
    }
    return { novas: novas, ignoradas: ignoradas };
  }

  function parseShopeeRows(rows) {
    var headerIdx = -1;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i] && rows[i].indexOf('Tipo de transação') !== -1) { headerIdx = i; break; }
    }
    if (headerIdx === -1) return { novas: [], ignoradas: 0, erro: true };
    var novas = [];
    var ignoradas = 0;
    for (var i = headerIdx + 1; i < rows.length; i++) {
      var r = rows[i];
      if (!r || r.length < 6) continue;
      var dataRaw = String(r[0] || '').trim();
      var tipoRaw = String(r[1] || '').trim();
      var descricao = String(r[2] || '').trim();
      var idPedido = String(r[3] || '').trim();
      var direcao = String(r[4] || '').trim();
      var valor = parseFloat(r[5]);
      if (!dataRaw || isNaN(valor)) continue;
      var data = dataRaw.split(' ')[0];
      var origemId = 'shopee-' + idPedido + '-' + tipoRaw + '-' + i;
      var tipoFinal = null;
      var descLower = descricao.toLowerCase();
      if (tipoRaw === 'Saques' || tipoRaw === 'Shopee Acelera') {
        ignoradas++; continue;
      } else if (tipoRaw === 'Renda do pedido') {
        tipoFinal = direcao === 'Entrada' ? 'venda' : 'despesa';
      } else if (tipoRaw === 'Ajuste') {
        tipoFinal = (descLower.indexOf('reembolso') !== -1 || descLower.indexOf('devolução') !== -1 || descLower.indexOf('devolucao') !== -1) ? 'reembolso' : 'despesa';
      } else if (tipoRaw === 'Saldo da Carteira - Pagamento') {
        tipoFinal = 'despesa';
      } else {
        ignoradas++; continue;
      }
      if (jaImportado(origemId)) { ignoradas++; continue; }
      novas.push({
        id: uid(), origemId: origemId, data: data, tipo: tipoFinal,
        descricao: 'Shopee - ' + (descricao || tipoRaw) + (idPedido && idPedido !== '-' ? ' (' + idPedido + ')' : ''),
        valor: Math.abs(valor)
      });
    }
    return { novas: novas, ignoradas: ignoradas };
  }

  function parseApiJson(texto, origemPrefix, labelFonte) {
    origemPrefix = origemPrefix || 'api-ml-';
    labelFonte = labelFonte || 'Mercado Livre';
    var novas = [];
    var ignoradas = 0;
    var atualizadas = 0;
    var dados;
    try { dados = JSON.parse(texto); } catch (e) { return { novas: [], ignoradas: 0, atualizadas: 0, erro: true }; }
    if (!Array.isArray(dados)) return { novas: [], ignoradas: 0, atualizadas: 0, erro: true };
    dados.forEach(function (item, i) {
      var tipo = item.tipo;
      var valor = parseFloat(item.valor);
      var dataRaw = String(item.data || '').trim();
      if (!dataRaw || isNaN(valor) || ['venda', 'compra', 'despesa', 'devolucao', 'cancelamento', 'reembolso'].indexOf(tipo) === -1) {
        ignoradas++; return;
      }
      var data = dataRaw.split('T')[0];
      var origemId = origemPrefix + item.id + '-' + tipo;
      var existente = state.transacoes.find(function (t) { return t.origemId === origemId; });
      if (existente) {
        var mudou = false;
        if (tipo === 'venda' && Array.isArray(item.itens) && (!Array.isArray(existente.itens) || (item.custos_ml && JSON.stringify(existente.itens) !== JSON.stringify(item.itens)))) {
          existente.itens = item.itens;
          mudou = true;
        }
        if (tipo === 'venda' && item.custos_ml && JSON.stringify(existente.custosMl || null) !== JSON.stringify(item.custos_ml)) {
          existente.custosMl = item.custos_ml;
          mudou = true;
        }
        if (mudou) atualizadas++; else ignoradas++;
        return;
      }
      var transacaoNova = {
        id: uid(), origemId: origemId, data: data, tipo: tipo,
        descricao: labelFonte + ' (API) - pedido ' + item.id,
        valor: Math.abs(valor)
      };
      if (tipo === 'venda' && Array.isArray(item.itens)) {
        transacaoNova.itens = item.itens;
      }
      if (tipo === 'venda' && item.custos_ml) {
        transacaoNova.custosMl = item.custos_ml;
      }
      novas.push(transacaoNova);
    });
    return { novas: novas, ignoradas: ignoradas, atualizadas: atualizadas };
  }

  function processarArquivo(file, onDone) {
    var nome = file.name.toLowerCase();
    if (nome.endsWith('.json')) {
      var readerJson = new FileReader();
      readerJson.onload = function (e) { onDone(parseApiJson(e.target.result, 'api-ml-', 'Mercado Livre'), 'Mercado Livre (API)'); };
      readerJson.onerror = function () { onDone({ novas: [], ignoradas: 0, erro: true }, '—'); };
      readerJson.readAsText(file);
    } else if (nome.endsWith('.csv')) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var texto = e.target.result;
        if (texto.indexOf('TRANSACTION_TYPE') !== -1) {
          onDone(parseMercadoLivreCsv(texto), 'Mercado Livre');
        } else {
          // tenta como planilha shopee exportada em csv (linhas separadas por vírgula)
          var linhas = texto.split(/\r?\n/).map(function (l) { return l.split(','); });
          onDone(parseShopeeRows(linhas), 'Shopee');
        }
      };
      reader.onerror = function () { onDone({ novas: [], ignoradas: 0, erro: true }, '—'); };
      reader.readAsText(file);
    } else {
      var reader2 = new FileReader();
      reader2.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, { type: 'array' });
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });

        }
      };
      reader2.onerror = function () { onDone({ novas: [], ignoradas: 0, erro: true }, '—'); };
      reader2.readAsArrayBuffer(file);
    }
  }

  // ===================== CALCULADORA 3D =====================

  function calc3dPadrao() {
    return {
      kwh: 0.95,              // R$ por kWh da conta de luz
      perdaPct: 8,            // % de pecas perdidas/falhas
      manutencaoHora: 0.30,   // R$ por hora de impressao (bico, mesa, correia...)
      impressoras: [{ id: 'imp1', nome: 'Minha impressora', watts: 150, preco: 2500, vidaHoras: 5000 }],
      filamentos: [],         // lotes: {id, data, tipo, descricao, kg, preco, frete}
      embalagens: [],         // lotes: {id, data, nome, qtd, preco, frete}
      produtos: [],           // {id, nome, tipo, gramas, horas, porPlaca, impressoraId, embalagem, extras, anuncios}
      simulador: { comissao: 20, taxaFixa: 4, frete: 0, imposto: 4 }
    };
  }

  function getCalc3d() {
    if (!state.calc3d) state.calc3d = calc3dPadrao();
    return state.calc3d;
  }

  async function salvarCalc3d() {
    try { await window.storage.set('ml-calc3d', JSON.stringify(state.calc3d)); } catch (e) {}
  }

  function num(v) { var n = Number(String(v === undefined || v === null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; }

  // Custo por grama de um tipo de filamento: media ponderada de todos os lotes daquele tipo
  // (soma do que voce pagou, com frete) / (soma dos gramas que chegaram).
  function custoGrama(tipo) {
    var c = getCalc3d();
    var lotes = c.filamentos.filter(function (l) { return (l.tipo || '').toUpperCase() === (tipo || '').toUpperCase(); });
    if (!lotes.length) lotes = c.filamentos;
    var gramas = lotes.reduce(function (s, l) { return s + num(l.kg) * 1000; }, 0);
    var pago = lotes.reduce(function (s, l) { return s + num(l.preco) + num(l.frete); }, 0);
    return gramas > 0 ? pago / gramas : 0;
  }

  function custoEmbalagem(nome) {
    var c = getCalc3d();
    var lotes = c.embalagens.filter(function (l) { return l.nome === nome; });
    var qtd = lotes.reduce(function (s, l) { return s + num(l.qtd); }, 0);
    var pago = lotes.reduce(function (s, l) { return s + num(l.preco) + num(l.frete); }, 0);
    return qtd > 0 ? pago / qtd : 0;
  }

  function tiposFilamento() {
    var t = {};
    getCalc3d().filamentos.forEach(function (l) { if (l.tipo) t[l.tipo.toUpperCase()] = true; });
    var lista = Object.keys(t);
    return lista.length ? lista : ['PLA'];
  }

  function nomesEmbalagem() {
    var t = {};
    getCalc3d().embalagens.forEach(function (l) { if (l.nome) t[l.nome] = true; });
    return Object.keys(t);
  }

  function custoPeca3d(p) {
    var c = getCalc3d();
    var imp = c.impressoras.find(function (i) { return i.id === p.impressoraId; }) || c.impressoras[0] || { watts: 0, preco: 0, vidaHoras: 1 };
    var porPlaca = Math.max(1, num(p.porPlaca) || 1);
    var horas = num(p.horas);
    var material = num(p.gramas) * custoGrama(p.tipo);
    var energia = horas * (num(imp.watts) / 1000) * num(c.kwh);
    var desgaste = horas * (num(imp.vidaHoras) > 0 ? num(imp.preco) / num(imp.vidaHoras) : 0);
    var manutencao = horas * num(c.manutencaoHora);
    var porPeca = (material + energia + desgaste + manutencao) / porPlaca;
    var perda = porPeca * num(c.perdaPct) / 100;
    var emb = p.embalagem ? custoEmbalagem(p.embalagem) : 0;
    var extras = num(p.extras);
    return {
      material: material / porPlaca, energia: energia / porPlaca, desgaste: desgaste / porPlaca,
      manutencao: manutencao / porPlaca, perda: perda, embalagem: emb, extras: extras,
      total: porPeca + perda + emb + extras
    };
  }

  // Custo de um anuncio vindo da calculadora 3D (usado pela aba Lucro real)
  function custo3dDoAnuncio(itemId) {
    var id = String(itemId || '').trim().toUpperCase();
    if (!id || !state.calc3d) return null;
    var p = state.calc3d.produtos.find(function (x) {
      return String(x.anuncios || '').toUpperCase().split(/[\s,;]+/).indexOf(id) !== -1;
    });
    return p ? custoPeca3d(p).total : null;
  }

  // ===================== LUCRO REAL =====================

  function horasDesdeAtualizacaoAutomacao() {
    if (!state.faturamento || !state.faturamento.atualizado_em) return null;
    var t = new Date(state.faturamento.atualizado_em).getTime();
    if (isNaN(t)) return null;
    return (Date.now() - t) / 36e5;
  }

  function fmtPct(n) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    return (n * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
  }

  function custoDoItem(itemId) {
    var id = String(itemId || '').trim().toUpperCase();
    var c3d = custo3dDoAnuncio(id);
    if (c3d !== null) return { valor: c3d, fonte: '3d' };
    var prod = state.produtos.find(function (p) { return String(p.mlItemId || '').trim().toUpperCase() === id && id; });
    if (prod && prod.custo !== '' && !isNaN(Number(prod.custo))) return { valor: Number(prod.custo), fonte: 'estoque' };
    if (state.custosAvulsos[id] !== undefined && state.custosAvulsos[id] !== '') return { valor: Number(state.custosAvulsos[id]), fonte: 'avulso' };
    return null;
  }

  // Junta as vendas dos ultimos N dias por anuncio e calcula o lucro real de cada um.
  function calcLucroPorProduto(dias) {
    var limite = new Date();
    limite.setHours(0, 0, 0, 0);
    limite.setDate(limite.getDate() - dias + 1);
    var limiteStr = limite.toISOString().slice(0, 10);
    var imposto = (Number(state.configLucro.imposto) || 0) / 100;
    var alvo = (Number(state.configLucro.margemAlvo) || 0) / 100;
    var grupos = {};
    var semDados = 0;

    state.transacoes.forEach(function (t) {
      if (t.tipo !== 'venda' || !t.custosMl || !Array.isArray(t.itens) || t.data < limiteStr) {
        if (t.tipo === 'venda' && !t.custosMl && t.data >= limiteStr && (t.origemId || '').indexOf('api-ml-') === 0) semDados++;
        return;
      }
      var valor = Number(t.valor) || 0;
      var c = t.custosMl;
      var liquidoPedido = (c.liquido_recebido !== null && c.liquido_recebido !== undefined)
        ? Number(c.liquido_recebido)
        : valor - (Number(c.comissao) || 0) - (Number(c.frete) || 0);
      var brutoItens = t.itens.reduce(function (s, i) { return s + (Number(i.preco_unitario) || 0) * (Number(i.quantidade) || 1); }, 0);
      t.itens.forEach(function (i) {
        var qtd = Number(i.quantidade) || 1;
        var parte = brutoItens > 0 ? ((Number(i.preco_unitario) || 0) * qtd) / brutoItens : 1 / t.itens.length;
        var id = String(i.item_id || 'sem-id');
        var g = grupos[id] || (grupos[id] = { itemId: id, titulo: i.titulo || id, tipoAnuncio: i.tipo_anuncio || '', unidades: 0, vendas: 0, receita: 0, comissao: 0, frete: 0, liquido: 0 });
        g.unidades += qtd;
        g.vendas += 1;
        g.receita += valor * parte;
        g.comissao += Number(i.comissao) || 0;
        g.frete += (Number(c.frete) || 0) * parte;
        g.liquido += liquidoPedido * parte;
      });
    });

    var linhas = Object.keys(grupos).map(function (k) {
      var g = grupos[k];
      var custo = custoDoItem(g.itemId);
      g.custoUnit = custo ? custo.valor : null;
      g.fonteCusto = custo ? custo.fonte : null;
      g.imposto = g.receita * imposto;
      g.taxasMl = g.receita - g.liquido;
      g.precoMedio = g.unidades ? g.receita / g.unidades : 0;
      if (g.custoUnit !== null) {
        g.custoTotal = g.custoUnit * g.unidades;
        g.lucro = g.liquido - g.imposto - g.custoTotal;
        g.lucroUnit = g.unidades ? g.lucro / g.unidades : 0;
        g.margem = g.receita ? g.lucro / g.receita : null;
        g.roi = g.custoTotal ? g.lucro / g.custoTotal : null;
      } else {
        g.custoTotal = null; g.lucro = null; g.lucroUnit = null; g.margem = null; g.roi = null;
      }
      g.maxCompra = g.unidades ? (g.liquido - g.imposto) / g.unidades - alvo * g.precoMedio : null;
      return g;
    });
    return { linhas: linhas, semDados: semDados };
  }

    if (typeof XLSX === 'undefined') { alertaSimples('Não consegui carregar o gerador de Excel. Confira sua internet.'); return; }
    var rows = linhas.map(function (g) {

        celCusto,
        el('td', { class: 'num', style: g.lucroUnit !== null && g.lucroUnit < 0 ? 'color:#B23A2E; font-weight:700;' : 'font-weight:600;', text: g.lucroUnit === null ? '—' : fmtMoney(g.lucroUnit) }),
        el('td', { class: 'num', text: g.lucro === null ? '—' : fmtMoney(g.lucro) }),
        el('td', { class: 'num', text: fmtPct(g.margem) }),
        el('td', { class: 'num', title: 'Preço máximo de compra para ter ' + cfg.margemAlvo + '% de margem', text: g.maxCompra === null ? '—' : fmtMoney(Math.max(0, g.maxCompra)) })
      ]));
    });
    card.appendChild(el('div', { class: 'pml-scroll' }, [table]));
    card.appendChild(el('p', { class: 'pml-note', html: '<b>Taxas ML</b> = comissão + frete que você pagou, de cada venda real (vem da API). <b>Recebido</b> = o que caiu para você. <b>Lucro</b> = recebido − imposto (' + cfg.imposto + '%) − custo do produto. <b>Pagar até</b> = o máximo que você pode pagar no produto para manter ' + cfg.margemAlvo + '% de margem. Custos do mês que não são por venda (armazenagem Full, antecipação, eShop) aparecem na fatura abaixo.' }));
    wrap.appendChild(card);

    renderFaturaCard(wrap);
  }

  function renderFaturaCard(wrap) {
    var fat = state.faturamento;
    var card = el('div', { class: 'pml-card' });
    card.appendChild(el('p', { class: 'pml-section-title', text: 'Fatura do Mercado Livre e Mercado Pago' }));
    if (!fat || !Array.isArray(fat.periodos) || fat.periodos.length === 0) {
      card.appendChild(el('div', { class: 'pml-empty', text: 'A fatura chega pela automação. Assim que ela rodar com a versão nova, aparece aqui tudo o que o ML cobrou no mês.' }));
      wrap.appendChild(card);
      return;
    }
    var periodos = fat.periodos.filter(function (p) { return (p.linhas || []).length > 0; });
    if (!periodos.length) { card.appendChild(el('div', { class: 'pml-empty', text: 'Sem detalhes de fatura ainda.' })); wrap.appendChild(card); return; }
    var padrao = periodos.find(function (p) { return p.situacao === 'fechada'; }) || periodos[0];
    var atual = periodos.find(function (p) { return p.chave === state.fatPeriodo; }) || padrao;

    function fmtData(d) { var x = String(d || '').split('-'); return x.length === 3 ? x[2] + '/' + x[1] : d; }
    var sel = el('select', { onchange: function () { state.fatPeriodo = sel.value; render(); } }, periodos.map(function (p) {
      var o = el('option', { value: p.chave, text: 'Fatura ' + p.chave.slice(0, 7) + ' (' + fmtData(p.de) + ' a ' + fmtData(p.ate) + ')' + (p.situacao === 'aberta' ? ' — em andamento' : '') });
      if (p.chave === atual.chave) o.setAttribute('selected', '');
      return o;
    }));
    card.appendChild(el('div', { class: 'pml-field', style: 'max-width:380px; margin-bottom:14px;' }, [sel]));

    var cats = {};
    var cobrado = 0, estornado = 0;
    atual.linhas.forEach(function (l) {
      var c = cats[l.categoria] || (cats[l.categoria] = { total: 0, linhas: [] });
      c.total += l.valor; c.linhas.push(l);
      if (l.valor >= 0) cobrado += l.valor; else estornado += l.valor;
    });
    var nomes = Object.keys(cats).sort(function (a, b) {
      if (a === 'Estornos e bonificações') return 1;
      if (b === 'Estornos e bonificações') return -1;
      return cats[b].total - cats[a].total;
    });
    nomes.forEach(function (n) {
      var c = cats[n];
      var det = el('details', { class: 'pml-fat-cat' });
      det.appendChild(el('summary', {}, [
        el('span', { html: '<b>' + n + '</b> <span class="pml-margin">(' + c.linhas.length + ')</span>' }),
        el('span', { style: 'font-weight:700; ' + (c.total < 0 ? 'color:#2F6E52;' : ''), text: fmtMoney(c.total) })
      ]));
      c.linhas.forEach(function (l) {
        det.appendChild(el('div', { class: 'pml-fat-linha' }, [el('span', { text: l.descricao }), el('span', { text: fmtMoney(l.valor) })]));
      });
      card.appendChild(det);
    });
    card.appendChild(el('div', { class: 'pml-fat-cat', style: 'display:flex; justify-content:space-between; font-size:15px;' }, [
      el('b', { text: 'Custo real do período' }), el('b', { text: fmtMoney(cobrado + estornado) })
    ]));

    var dicas = [];
    if (cats['Antecipação'] && cats['Antecipação'].total > 0) {
      dicas.push('💸 <b>Você pagou ' + fmtMoney(cats['Antecipação'].total) + ' para receber dinheiro antes do prazo.</b> Se não precisava do dinheiro na hora, vale desligar a antecipação automática no Mercado Pago e antecipar só quando precisar.');
    }
    if (cats['Parcelamento'] && cats['Parcelamento'].total > 0) {
      dicas.push('💳 <b>' + fmtMoney(cats['Parcelamento'].total) + ' em taxas de parcelamento.</b> Vem dos anúncios Premium e de campanhas com parcelamento sem juros — confira se as vendas a mais compensam.');
    }
    if (cats['Publicidade'] && cats['Estornos e bonificações']) {
      var pub = cats['Publicidade'].total;
      var bonPub = cats['Estornos e bonificações'].linhas.filter(function (l) { return /publicidade|ads/i.test(l.descricao); }).reduce(function (s, l) { return s + l.valor; }, 0);
      if (pub > 0 && bonPub < 0) dicas.push('📣 Dos ' + fmtMoney(pub) + ' de Product Ads, ' + fmtMoney(-bonPub) + ' foram bonificados pelo ML (crédito grátis).');
    }
    if (dicas.length) card.appendChild(el('div', { class: 'pml-dica', html: dicas.join('<br><br>') }));
    if (fat.atualizado_em) card.appendChild(el('p', { class: 'pml-note', text: 'Atualizado em ' + new Date(fat.atualizado_em).toLocaleString('pt-BR') + '.' }));
    wrap.appendChild(card);
  }

  function render() {
    root.innerHTML = '';
    var wrap = el('div', { class: 'pml-wrap' + (state.tab === 'lucro' || state.tab === 'calc3d' ? ' largo' : '') });
    renderHeader(wrap);
    renderTabs(wrap);
    if (!state.loaded) {
      wrap.appendChild(el('div', { class: 'pml-empty', text: 'Carregando seu painel...' }));
      root.appendChild(wrap);
      return;
    }
    if (state.errorMsg) {
      wrap.appendChild(el('div', { class: 'pml-error', text: state.errorMsg }));
    }
    if (sincronizacaoAtrasada()) {
      wrap.appendChild(el('div', { class: 'pml-import-summary', style: 'border:1px solid #F0D8D2; color:#B23A2E; margin-bottom:16px;', text: '⚠ A sincronização automática não roda há mais de 2 dias. Confere se a automação no GitHub Actions ainda está rodando, ou sincronize manualmente na aba Importar.' }));
    }
    var horasSemAtualizar = horasDesdeAtualizacaoAutomacao();
    if (horasSemAtualizar !== null && horasSemAtualizar > 6) {
      wrap.appendChild(el('div', { class: 'pml-import-summary', style: 'border:1px solid #F0D8D2; color:#B23A2E; margin-bottom:16px;', text: '⚠ A automação do Mercado Livre não manda dados novos há ' + Math.round(horasSemAtualizar) + ' horas. As vendas mais recentes podem não estar aparecendo. Verifique a automação no GitHub (aba Actions).' }));
    }
    renderMetrics(wrap);
    if (state.tab === 'geral') {
      renderGraficoVendas(wrap);
      var infoCard = el('div', { class: 'pml-card' }, [
        el('p', { class: 'pml-section-title', text: 'Como usar' }),
        el('p', { style: 'font-size:14px; color:#6B6558; margin:0; line-height:1.6;', text: 'Cadastre seus produtos na aba Estoque com o custo e a quantidade — isso alimenta o valor em estoque acima. As vendas do Mercado Livre e da Shopee entram sozinhas (aba Importar → Sincronização automática). Lance compras e despesas manuais na aba Financeiro. Tudo fica salvo aqui, é só seu.' })
      ]);
      wrap.appendChild(infoCard);
    } else if (state.tab === 'estoque') {
      renderEstoqueTab(wrap);
    } else if (state.tab === 'lucro') {
      renderLucroTab(wrap);
    } else if (state.tab === 'calc3d') {
      renderCalc3dTab(wrap);
    } else if (state.tab === 'financeiro') {
      renderFinanceiroTab(wrap);
    } else {
      renderImportarTab(wrap);
    }
    root.appendChild(wrap);
  }

  loadData();
})();
</script>
</body>
</html>
