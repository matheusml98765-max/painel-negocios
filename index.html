  function blocoMapaCalor() {
    var m = calcMapaCalor(state.transacoes, 30);
    var sec = el('section', { class: 'ini-bloco ini-c12' });
    sec.appendChild(el('div', { class: 'cab' }, [el('h3', { text: 'Quando você mais vende (30 dias)' })]));
    if (!m.total) {
      sec.appendChild(el('div', { class: 'pml-empty', text: 'O horário das vendas começa a ser registrado com a automação nova. Em algumas horas o mapa aparece aqui.' }));
      return sec;
    }
    var faixa = melhorFaixa(m.porHora);
    var diaTop = m.porDia.indexOf(Math.max.apply(null, m.porDia));
    var dica = 'Seu melhor horário é das ' + faixa.inicio + 'h às ' + faixa.fim + 'h (' + faixa.pedidos + ' pedidos) e o melhor dia é ' + DIAS_SEMANA[diaTop].toLowerCase() + '. Concentre Ads, ofertas relâmpago e posts nesse período.';
    sec.appendChild(el('p', { class: 'pml-note', style: 'margin:-6px 0 14px; font-size:13.5px; color:var(--ink);', text: dica }));
    var grade = el('div', { class: 'calor-grade', role: 'table', 'aria-label': 'Pedidos por dia da semana e hora' });
    grade.appendChild(el('div', { class: 'calor-canto' }));
    for (var h = 0; h < 24; h++) grade.appendChild(el('div', { class: 'calor-hora', text: h % 3 === 0 ? h + 'h' : '' }));
    var niveis = 5;
    for (var d = 0; d < 7; d++) {

      for (var hh = 0; hh < 24; hh++) {

        grade.appendChild(el('div', {
          class: 'calor-cel n' + nivel, role: 'cell', tabindex: c.pedidos ? '0' : '-1',
          title: DIAS_SEMANA[d] + ', ' + hh + 'h às ' + (hh + 1) + 'h: ' + c.pedidos + (c.pedidos === 1 ? ' pedido' : ' pedidos') + ' · ' + fmtMoney(c.valor),
          'aria-label': DIAS_SEMANA[d] + ' ' + hh + ' horas: ' + c.pedidos + ' pedidos'
        }));

    }
    sec.appendChild(el('div', { class: 'pml-scroll' }, [grade]));
    var leg = el('div', { class: 'calor-legenda' }, [el('span', { text: 'Menos' })]);
    for (var n = 0; n <= niveis; n++) leg.appendChild(el('i', { class: 'calor-cel n' + n }));

  }

  // ---------- Backup dos custos ----------
  var CHAVES_BACKUP = ['ml-produtos', 'ml-custos-avulsos', 'ml-calc3d', 'ml-config-lucro', 'ml-metas', 'ml-gist-url', 'ml-gist-url-shopee'];

  async function exportarBackup() {
    var dados = { tipo: 'backup-painel-top-brasil-shop', versao: 1, criadoEm: new Date().toISOString(), chaves: {} };
    for (var i = 0; i < CHAVES_BACKUP.length; i++) {
      try { var v = await window.storage.get(CHAVES_BACKUP[i]); if (v) dados.chaves[CHAVES_BACKUP[i]] = v.value; } catch (e) {}
    }
    var blob = new Blob([JSON.stringify(dados, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup-painel-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function renderBackupCard(wrap) {
    var card = el('div', { class: 'pml-card' });
    card.appendChild(el('p', { class: 'pml-section-title', text: 'Backup dos seus custos' }));
    card.appendChild(el('p', { style: 'font-size:13.5px; color:var(--muted); margin:0 0 12px; line-height:1.6;', text: 'Os custos, a calculadora 3D e as metas ficam salvos só neste navegador. Baixe um backup de vez em quando — e use o mesmo arquivo para abrir o painel com tudo em outro computador ou no celular.' }));

          var n = 0;
          for (var k in dados.chaves) { if (CHAVES_BACKUP.indexOf(k) !== -1) { await window.storage.set(k, dados.chaves[k]); n++; } }

          setTimeout(function () { location.reload(); }, 800);

  // ===================== CONTAS POR PRODUTO =====================
  // Historico, simulador de desconto, Ads por produto, reposicao e filamento.

  function isoDia(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function mesmoItem(a, b) { return String(a || '').trim().toUpperCase() === String(b || '').trim().toUpperCase(); }

  // Vendas de um anuncio por semana (segunda a domingo), das ultimas N semanas.
  // lucro fica null na semana em que falta o custo ou as taxas de alguma venda.
  function historicoProduto(itemId, semanas, agora) {
    semanas = semanas || 12;
    agora = agora || new Date();
    var hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
    var seg = new Date(hoje); seg.setDate(hoje.getDate() - (hoje.getDay() + 6) % 7);
    var semanasLista = [];
    for (var i = semanas - 1; i >= 0; i--) {
      var d = new Date(seg); d.setDate(seg.getDate() - 7 * i);
      semanasLista.push({ inicio: isoDia(d), unidades: 0, receita: 0, liquido: 0, semTaxas: 0 });
    }
    state.transacoes.forEach(function (t) {
      if (t.tipo !== 'venda' || !Array.isArray(t.itens) || !t.data || t.data < semanasLista[0].inicio) return;
      var alvo = null;
      for (var k = semanasLista.length - 1; k >= 0; k--) { if (t.data >= semanasLista[k].inicio) { alvo = semanasLista[k]; break; } }
      if (!alvo) return;
      var bruto = t.itens.reduce(function (s, i) { return s + (Number(i.preco_unitario) || 0) * (Number(i.quantidade) || 1); }, 0);
      var c = custosDaVenda(t);
      t.itens.forEach(function (i) {
        if (!mesmoItem(i.item_id, itemId)) return;
        var qtd = Number(i.quantidade) || 1;
        var parte = bruto > 0 ? (Number(i.preco_unitario) || 0) * qtd / bruto : 1 / t.itens.length;
        alvo.unidades += qtd;
        alvo.receita += (Number(t.valor) || 0) * parte;
        if (c) alvo.liquido += c.liquido * parte; else alvo.semTaxas += qtd;
      });
    });
    var custo = custoDoItem(itemId);
    var imp = (Number(state.configLucro.imposto) || 0) / 100;
    semanasLista.forEach(function (s) {
      s.precoMedio = s.unidades ? s.receita / s.unidades : null;
      s.lucro = (custo && !s.semTaxas) ? s.liquido - s.receita * imp - custo.valor * s.unidades : null;
    });
    return semanasLista;
  }

  // Simula um desconto sobre o preco medio atual, mantendo a % de taxas, o frete
  // por unidade e a taxa fixa por pedido da Shopee que aparecem nas vendas reais.
  function simularDesconto(g, desconto) {
    if (!g || !g.unidades || !g.receita) return null;
    var imp = (Number(state.configLucro.imposto) || 0) / 100;
    var fixoPedido = 0;
    if (g.plataforma === 'shopee') {
      var pl = (getCalc3d().plataformas || []).find(function (p) { return p.id === 'shopee'; });
      fixoPedido = pl ? num(pl.taxaFixa) : 0;
    }
    var fixoUn = fixoPedido * g.vendas / g.unidades;
    var freteUn = g.frete / g.unidades;
    var taxas = g.receita - g.liquido;
    var pct = Math.max(0, (taxas - g.frete - fixoUn * g.unidades) / g.receita);
    var custo = g.custoUnit;
    function conta(preco) {
      var taxasUn = preco * pct + fixoUn + freteUn;
      var lucro = custo === null ? null : preco - taxasUn - preco * imp - custo;
      return { preco: preco, taxas: taxasUn, recebido: preco - taxasUn, lucro: lucro, margem: lucro === null || !preco ? null : lucro / preco };
    }
    var atual = conta(g.precoMedio);
    var novo = conta(g.precoMedio * (1 - desconto));
    var res = { atual: atual, novo: novo, pctTaxas: pct, vendasAMais: null, descontoMaximo: null };
    if (custo !== null) {
      var precoMin = (fixoUn + freteUn + custo) / Math.max(0.01, 1 - pct - imp);
      res.descontoMaximo = Math.max(0, 1 - precoMin / g.precoMedio);
      if (atual.lucro > 0 && novo.lucro > 0) res.vendasAMais = atual.lucro / novo.lucro - 1;
    }
    return res;
  }

  // Ads por anuncio (Shopee Ads e Product Ads do ML), comparado com a margem do produto antes do Ads.
  // decisao: 'aumentar' | 'manter' | 'pausar' | 'sem-custo' | 'pouco-dado'
  function calcAdsPorProduto(plataforma) {
    plataforma = plataforma || 'todas';
    var fontes = [];
    var sp = state.adsShopee, ml = state.anunciosMl && state.anunciosMl.ads;
    if ((plataforma === 'todas' || plataforma === 'shopee') && sp && sp.por_item && Object.keys(sp.por_item).length) fontes.push({ plat: 'shopee', dias: Number(sp.por_item_dias) || 30, por_item: sp.por_item });
    if ((plataforma === 'todas' || plataforma === 'ml') && ml && ml.por_item && Object.keys(ml.por_item).length) fontes.push({ plat: 'ml', dias: Number(ml.dias) || 30, por_item: ml.por_item });
    if (!fontes.length) return null;
    var linhas = [];
    fontes.forEach(function (f) {
      var mapa = {};
      calcLucroPorProduto(f.dias, f.plat).linhas.forEach(function (g) { mapa[String(g.itemId).toUpperCase()] = g; });
      var titulos = {};
      ((state.anunciosMl && state.anunciosMl.itens) || []).forEach(function (it) { titulos[it.id] = it.titulo; });
      Object.keys(f.por_item).forEach(function (id) {
        var x = f.por_item[id];
        var g = mapa[String(id).toUpperCase()] || null;
        var acos = x.vendas > 0 ? x.gasto / x.vendas : null;
        var margem = g && g.margem !== null ? g.margem : null;
        var decisao;
        if (x.vendas === 0 && x.gasto < 15) decisao = 'pouco-dado';
        else if (margem === null) decisao = 'sem-custo';
        else if (acos === null || acos > margem) decisao = 'pausar';
        else if (acos < margem * 0.5) decisao = 'aumentar';
        else decisao = 'manter';
        var nomeCamp = (x.campanhas || []).map(function (c) { return c.nome; }).filter(Boolean)[0];
        linhas.push({
          itemId: id, plataforma: f.plat, titulo: g ? g.titulo : (titulos[id] || nomeCamp || 'Anúncio ' + id), gasto: x.gasto, vendasAds: x.vendas, pedidosAds: x.pedidos,
          cliques: x.cliques, acos: acos, margem: margem, lucro: g ? g.lucro : null,
          lucroDepois: g && g.lucro !== null ? g.lucro - x.gasto : null, decisao: decisao, campanhas: x.campanhas || [], nomeCampanha: nomeCamp || ''
        });
      });
    });
    linhas.sort(function (p, q) { return q.gasto - p.gasto; });
    return { dias: fontes[0].dias, linhas: linhas, plataformas: fontes.map(function (f) { return f.plat; }) };
  }

  // Unidades vendidas por anuncio nos ultimos N dias.
  function unidadesPorItem(dias) {
    var lim = limiteDias(dias);
    var u = {};
    state.transacoes.forEach(function (t) {
      if (t.tipo !== 'venda' || !Array.isArray(t.itens) || t.data < lim) return;
      t.itens.forEach(function (i) {
        var id = String(i.item_id || '').trim().toUpperCase();
        if (id) u[id] = (u[id] || 0) + (Number(i.quantidade) || 1);
      });
    });
    return u;
  }

  // Quanto tempo o estoque aguenta e quanto comprar.
  // Usa o estoque real dos anuncios do ML (automacao) e, para o resto, a quantidade cadastrada na aba Estoque.
  // prazo = dias que o fornecedor leva para entregar; cobrir = dias de venda a garantir depois que chegar.
  function calcReposicao(prazo, cobrir) {
    prazo = prazo || 10; cobrir = cobrir || 30;
    var u = unidadesPorItem(30);
    var lista = [], vistos = {};
    function linha(nome, id, qtd, fonte, extra) {
      var porDia = (u[id] || 0) / 30;
      var cobertura = porDia > 0 ? qtd / porDia : null;
      var comprar = porDia > 0 ? Math.max(0, Math.ceil(porDia * (prazo + cobrir) - qtd)) : 0;
      var situacao = porDia === 0 ? 'parado' : (cobertura <= prazo ? 'urgente' : (cobertura <= prazo + 7 ? 'logo' : 'ok'));
      var fim = cobertura === null ? null : new Date(Date.now() + cobertura * 864e5);
      return Object.assign({ produto: { nome: nome }, itemId: id, estoque: qtd, porDia: porDia, cobertura: cobertura, acabaEm: fim, comprar: comprar, situacao: situacao, fonte: fonte }, extra || {});
    }
    ((state.anunciosMl && state.anunciosMl.itens) || []).forEach(function (it) {
      if (it.status !== 'active' && !u[it.id]) return;
      vistos[it.id] = true;
      lista.push(linha(it.titulo, it.id, Number(it.estoque) || 0, 'ml', { full: !!it.full, pausado: it.status !== 'active' }));
    });
    state.produtos.filter(function (p) { return p.mlItemId; }).forEach(function (p) {
      var id = String(p.mlItemId).trim().toUpperCase();
      if (vistos[id]) return;
      lista.push(linha(p.nome, id, Number(p.quantidade) || 0, 'manual'));
    });
    var ordem = { urgente: 0, logo: 1, ok: 2, parado: 3 };
    return lista.sort(function (a, b) {
      return ordem[a.situacao] - ordem[b.situacao] || (a.cobertura === null ? 1e9 : a.cobertura) - (b.cobertura === null ? 1e9 : b.cobertura);
    });
  }

  // Ritmo de compra de filamento (pelos lotes da Calculadora 3D) e, quando as pecas
  // tem gramas e anuncios ligados, o consumo real pelas vendas.
  function calcFilamento(agora) {
    agora = agora || new Date();
    var c = state.calc3d;
    if (!c || !Array.isArray(c.filamentos) || c.filamentos.length < 2) return null;
    var lotes = c.filamentos.filter(function (l) { return l.data && num(l.kg) > 0; }).sort(function (a, b) { return a.data < b.data ? -1 : 1; });
    if (lotes.length < 2) return null;
    var primeiro = new Date(lotes[0].data + 'T12:00:00'), ultimo = new Date(lotes[lotes.length - 1].data + 'T12:00:00');
    var diasEntre = (ultimo - primeiro) / 864e5;
    var kgAntes = lotes.slice(0, -1).reduce(function (s, l) { return s + num(l.kg); }, 0);
    var kgDiaCompra = diasEntre > 0 ? kgAntes / diasEntre : null;
    var u = unidadesPorItem(30), gramas30 = 0, pecasLigadas = 0;
    (c.produtos || []).forEach(function (p) {
      if (!(num(p.gramas) > 0) || !p.anuncios) return;
      pecasLigadas++;
      String(p.anuncios).toUpperCase().split(/[\s,;]+/).forEach(function (id) { if (id) gramas30 += (u[id] || 0) * num(p.gramas); });
    });
    var kgDiaVendas = pecasLigadas && gramas30 > 0 ? gramas30 / 1000 / 30 : null;
    var ritmo = kgDiaVendas || kgDiaCompra;
    var kgUltimo = num(lotes[lotes.length - 1].kg);
    var proxima = ritmo ? new Date(ultimo.getTime() + kgUltimo / ritmo * 864e5) : null;
    return {
      lotes: lotes.length, kgTotal: kgAntes + kgUltimo, kgMesCompra: kgDiaCompra ? kgDiaCompra * 30 : null,
      kgMesVendas: kgDiaVendas ? kgDiaVendas * 30 : null, ultimaCompra: ultimo, kgUltimo: kgUltimo,
      proximaCompra: proxima, diasAteProxima: proxima ? Math.round((proxima - agora) / 864e5) : null,
      fonte: kgDiaVendas ? 'vendas' : 'compras'
    };
  }
  // ===================== TELAS POR PRODUTO =====================
  // Ficha do produto (historico + simulador de desconto + Ads), Ads por produto e reposicao.

  function abrirFichaProduto(itemId) {

  }

  var DECISAO_ADS = {
    aumentar: { tag: 'boa', texto: 'aumentar', dica: 'O Ads custa bem menos que a sua margem: dá para subir o orçamento.' },
    manter: { tag: 'baixa', texto: 'manter', dica: 'Dá lucro, mas a folga é pequena. Mantenha e acompanhe.' },

    'sem-custo': { tag: 'baixa', texto: 'sem custo', dica: 'Cadastre o custo da peça para saber se o Ads compensa.' },
    'pouco-dado': { tag: 'baixa', texto: 'pouco dado', dica: 'Gastou pouco até agora; espere mais uns dias.' }
  };

  function renderFichaProduto(wrap) {
    var id = state.fichaProduto;
    var g = calcLucroPorProduto(90, 'todas').linhas.find(function (x) { return mesmoItem(x.itemId, id); });
    var card = el('div', { class: 'pml-card ficha-prod' });
    var titulo = g ? g.titulo : id;
    card.appendChild(el('div', { style: 'display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:6px;' }, [

      ]),
      el('button', { class: 'pml-btn', style: 'padding:6px 12px; font-size:13px;', text: 'Fechar', onclick: function () { state.fichaProduto = null; render(); } })
    ]));

    card.appendChild(el('div', { class: 'pml-metrics', style: 'margin:14px 0;' }, [

      metricaFicha('Lucro por unidade', g.lucroUnit === null ? '—' : fmtMoney(g.lucroUnit), g.custoUnit === null ? 'falta o custo da peça' : 'custo ' + fmtMoney(g.custoUnit), g.lucroUnit === null ? '' : (g.lucroUnit >= 0 ? 'pos' : 'neg')),
      metricaFicha('Margem', fmtPct(g.margem), g.lucro === null ? '' : 'lucro total ' + fmtMoney(g.lucro))

    setTimeout(function () {
      var base = opcoesBaseGrafico();
      var labels = hist.map(function (s) { return s.inicio.slice(8, 10) + '/' + s.inicio.slice(5, 7); });
      var ds = [{ type: 'bar', label: 'Unidades', data: hist.map(function (s) { return s.unidades; }), backgroundColor: cssVar('--accent'), borderRadius: 4, maxBarThickness: 26, yAxisID: 'y1', order: 2 }];
      if (temLucro) ds.push({ type: 'line', label: 'Lucro', data: hist.map(function (s) { return s.unidades ? Math.round(s.lucro * 100) / 100 : null; }), borderColor: cssVar('--good'), backgroundColor: cssVar('--good'), tension: 0.3, pointRadius: 4, borderWidth: 2.5, spanGaps: true, yAxisID: 'y', order: 1 });
      var opts = Object.assign({}, base, {
        scales: {
          x: base.scales.x,
          y: Object.assign({}, base.scales.y, { display: temLucro, position: 'left', beginAtZero: true }),
          y1: { beginAtZero: true, position: temLucro ? 'right' : 'left', grid: { display: !temLucro, color: cssVar('--line') }, border: { display: false }, ticks: { color: cssVar('--muted'), precision: 0 } }
        }
      });
      opts.plugins = Object.assign({}, base.plugins, { tooltip: Object.assign({}, base.plugins.tooltip, { callbacks: { label: function (c) {
        return ' ' + c.dataset.label + ': ' + (c.dataset.label === 'Unidades' ? c.parsed.y + ' un.' + (hist[c.dataIndex].precoMedio ? ' a ' + fmtMoney(hist[c.dataIndex].precoMedio) : '') : fmtMoney(c.parsed.y));

      var linhas = [

        ['Você recebe', fmtMoney(s.atual.recebido), fmtMoney(s.novo.recebido)],
        ['Lucro por unidade', s.atual.lucro === null ? '—' : fmtMoney(s.atual.lucro), s.novo.lucro === null ? '—' : fmtMoney(s.novo.lucro)],
        ['Margem', fmtPct(s.atual.margem), fmtPct(s.novo.margem)]
      ];
      var t = el('table', { class: 'pml-table' }, [el('tr', {}, [el('th', { text: '' }), el('th', { class: 'num', text: 'Hoje' }), el('th', { class: 'num', text: 'Com ' + d + '% off' })])]);
      linhas.forEach(function (l) { t.appendChild(el('tr', {}, [el('td', { text: l[0] }), el('td', { class: 'num', text: l[1] }), el('td', { class: 'num', style: 'font-weight:700;', text: l[2] })])); });
      saida.appendChild(t);
      var msg;
      if (s.novo.lucro === null) msg = '✏️ Cadastre o custo deste produto para ver se o desconto compensa.';

  // ===================== RELATORIO DO MES =====================

  function intervaloMes(mes) {
    var p = mes.split('-'), ano = Number(p[0]), m = Number(p[1]);
    var fim = new Date(ano, m, 0).getDate();
    return { de: mes + '-01', ate: mes + '-' + String(fim).padStart(2, '0'), diasNoMes: fim };
  }

  function mesAnteriorDe(mes) {
    var p = mes.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 2, 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function mesesComVendas() {
    var m = {};
    state.transacoes.forEach(function (t) { if (t.tipo === 'venda' && t.data) m[t.data.slice(0, 7)] = true; });
    return Object.keys(m).sort().reverse();
  }

  function curto(t) {
    t = String(t || '');
    if (t.length <= 48) return t;
    return t.slice(0, 48).replace(/\s+\S*$/, '') + '…';
  }

  function vendasDoMes(mes) {
    var r = { total: 0, pedidos: 0, plat: {} };
    state.transacoes.forEach(function (t) {
      if (t.tipo !== 'venda' || (t.data || '').slice(0, 7) !== mes) return;
      var v = Number(t.valor) || 0, p = plataformaDe(t);
      r.total += v; r.pedidos++; r.plat[p] = (r.plat[p] || 0) + v;
    });
    return r;
  }

  function calcRelatorioMes(mes, agora) {
    agora = agora || new Date();
    var iv = intervaloMes(mes);
    var hoje = isoDia(agora);
    var emAndamento = hoje >= iv.de && hoje <= iv.ate;
    var vendas = vendasDoMes(mes);
    var anterior = vendasDoMes(mesAnteriorDe(mes));
    // So compara com o mes anterior se os dados cobrem o mes anterior inteiro
    var primeiraVenda = state.transacoes.reduce(function (m, t) { return t.tipo === 'venda' && t.data && t.data < m ? t.data : m; }, '9999');
    anterior.completo = primeiraVenda <= mesAnteriorDe(mes) + '-01';
    if (!anterior.completo) anterior.total = 0;
    var proj = emAndamento ? calcProjecaoMes(vendas.total, agora).projecao : vendas.total;
    var imp = (Number(state.configLucro.imposto) || 0) / 100;
    var alvo = (Number(state.configLucro.margemAlvo) || 0) / 100;
    var linhas = calcLucroPorProduto(0, 'todas', iv).linhas;
    var tot = linhas.reduce(function (a, g) {
      a.receita += g.receita;
      if (g.lucro !== null) { a.lucro += g.lucro; a.receitaComCusto += g.receita; } else { a.receitaSemCusto += g.receita; a.semCusto.push(g); }
      if (g.lucro !== null && g.lucro < 0) a.prejuizo.push(g);
      return a;

    var ads = (state.adsShopee && state.adsShopee.dias || []).reduce(function (a, d) {
      if (d.data >= iv.de && d.data <= iv.ate) { a.gasto += Number(d.gasto) || 0; a.vendas += Number(d.vendas_ads) || 0; a.dias++; }
      return a;
    }, { gasto: 0, vendas: 0, dias: 0 });
    // Ads proporcional a parte das vendas que tem custo (o resto nao entra no lucro)
    var lucroAposAds = tot.lucro - ads.gasto * (tot.receita ? tot.receitaComCusto / tot.receita : 0);
    var margem = tot.receitaComCusto ? lucroAposAds / tot.receitaComCusto : null;

    // ---- Problemas e oportunidades (em R$ por mes) ----
    var itens = [];
    tot.prejuizo.forEach(function (g) {
      itens.push({ valor: -g.lucro, tipo: 'prejuizo', texto: '<b>' + g.titulo + '</b> deu ' + fmtMoney(-g.lucro) + ' de prejuízo (' + g.unidades + ' un.).', acao: 'Suba o preço de ' + curto(g.titulo) + ' ou pague no máximo ' + fmtMoney(Math.max(0, g.maxCompra || 0)) + ' na próxima compra.' });
    });
    var adsProd = calcAdsPorProduto();
    if (adsProd) adsProd.linhas.filter(function (a) { return a.decisao === 'pausar'; }).forEach(function (a) {
      itens.push({ valor: a.gasto, tipo: 'ads', texto: (a.plataforma === 'ml' ? 'Product Ads do ML' : 'Shopee Ads') + ' de <b>' + a.titulo + '</b> gastou ' + fmtMoney(a.gasto) + ' nos últimos ' + adsProd.dias + ' dias, com o Ads levando ' + fmtPct(a.acos) + ' de cada venda (margem ' + fmtPct(a.margem) + ').', acao: 'Pause ou baixe o lance do Ads de ' + curto(a.titulo) + '.' });
    });
    var fat = state.faturamento && (state.faturamento.periodos || []).find(function (p) { return String(p.chave || '').slice(0, 7) === mes; });
    if (fat) {
      var antecip = (fat.linhas || []).filter(function (l) { return l.categoria === 'Antecipação'; }).reduce(function (s, l) { return s + l.valor; }, 0);
      if (antecip > 0) itens.push({ valor: antecip, tipo: 'antecipacao', texto: 'Na fatura ' + fat.chave.slice(0, 7) + ' do ML você pagou <b>' + fmtMoney(antecip) + '</b> para receber o dinheiro antes do prazo.', acao: 'Desligue a antecipação automática no Mercado Pago e antecipe só quando precisar.' });
    }
    // Pecas que chegaram quebradas no mes (devolucoes.json)
    var quebr = {};
    ((state.devolucoes && state.devolucoes.itens) || []).forEach(function (x) {
      var dia = String(x.data || '').slice(0, 10);
      if (!x.quebrado || x.status === 'CANCELLED' || dia < iv.de || dia > iv.ate) return;
      (x.itens || []).forEach(function (it) {
        var q = quebr[it.item_id] || (quebr[it.item_id] = { titulo: it.titulo || it.item_id, un: 0 });
        q.un += Number(it.quantidade) || 1;
      });

    Object.keys(quebr).forEach(function (id) {
      var q = quebr[id], c = custoDoItem(id);
      itens.push({ valor: c ? c.valor * q.un : 0, tipo: 'quebrado', texto: '<b>' + q.un + ' unidade(s) de ' + q.titulo + '</b> chegaram quebradas ao cliente' + (c ? ' (' + fmtMoney(c.valor * q.un) + ' em peças perdidas).' : ' (cadastre o custo para ver a perda).'), acao: 'Reforce a embalagem de ' + curto(q.titulo) + ': ' + q.un + ' chegaram quebradas no mês.' });
    });
    linhas.filter(function (g) { return g.receita > 0 && g.taxasMl / g.receita > 0.4 && g.lucro !== null && g.lucro >= 0; }).forEach(function (g) {
      itens.push({ valor: 0, tipo: 'taxa', texto: 'A plataforma ficou com <b>' + fmtPct(g.taxasMl / g.receita) + '</b> das vendas de ' + g.titulo + '.', acao: 'Revise o preço ou o tipo de anúncio de ' + curto(g.titulo) + ' (taxa acima de 40%).' });
    });
    itens.sort(function (a, b) { return b.valor - a.valor; });
    var emJogo = itens.reduce(function (s, i) { return s + i.valor; }, 0);

    // ---- Nota de 0 a 10 (cada desconto aparece na tela) ----
    var fatores = [];
    if (margem !== null && margem < alvo) fatores.push({ pontos: -Math.min(4, (alvo - margem) * 20), texto: 'margem de ' + fmtPct(margem) + ' abaixo da meta de ' + fmtPct(alvo) });
    if (tot.prejuizo.length) fatores.push({ pontos: -Math.min(2, tot.prejuizo.length * 0.5), texto: tot.prejuizo.length + ' produto(s) com prejuízo' });
    if (tot.receita && tot.receitaSemCusto / tot.receita > 0.1) fatores.push({ pontos: -2 * tot.receitaSemCusto / tot.receita, texto: fmtPct(tot.receitaSemCusto / tot.receita) + ' do faturamento sem custo cadastrado' });
    if (anterior.total && proj !== null && proj < anterior.total * 0.9) fatores.push({ pontos: -1, texto: 'vendas ' + (emAndamento ? 'projetadas ' : '') + fmtPct(proj / anterior.total - 1) + ' em relação ao mês anterior' });
    if (ads.gasto && ads.vendas && ads.gasto / ads.vendas > 0.15) fatores.push({ pontos: -1, texto: 'Shopee Ads levando ' + fmtPct(ads.gasto / ads.vendas) + ' das vendas que trouxe' });
    var nota = Math.max(0, Math.min(10, 10 + fatores.reduce(function (s, f) { return s + f.pontos; }, 0)));

    var destaques = linhas.filter(function (g) { return g.lucro !== null && g.lucro > 0; }).sort(function (a, b) { return b.lucro - a.lucro; }).slice(0, 5);
    var plano = itens.slice(0, 6).map(function (i) { return i.acao; });
    if (tot.semCusto.length) plano.push('Cadastre o custo de ' + tot.semCusto.length + ' produto(s) na aba Lucro real (' + fmtMoney(tot.receitaSemCusto) + ' em vendas sem lucro conhecido).');
    if (adsProd) adsProd.linhas.filter(function (a) { return a.decisao === 'aumentar'; }).slice(0, 2).forEach(function (a) { plano.push('Aumente o orçamento do Ads de ' + curto(a.titulo) + ': o Ads leva ' + fmtPct(a.acos) + ' e a margem é ' + fmtPct(a.margem) + '.'); });
    if (destaques[0]) plano.push('Garanta estoque de ' + curto(destaques[0].titulo) + ', o produto que mais deu lucro (' + fmtMoney(destaques[0].lucro) + ').');

  // ===================== LUZ DAS IMPRESSORAS E INSUMOS =====================
  // Tudo calculado pelas vendas: cada peca 3D vendida = as horas e os gramas do fatiamento
  // (Calculadora 3D) mais a % de perdas. Insumos (caixa, saco, fita, parafuso...) saem do
  // estoque contado pelo vendedor e baixam sozinhos a cada venda.

  function pecaDoItem(itemId) {
    var id = String(itemId || '').trim().toUpperCase();
    if (!id || !state.calc3d) return null;
    return (state.calc3d.produtos || []).find(function (p) {
      return String(p.anuncios || '').toUpperCase().split(/[\s,;]+/).indexOf(id) !== -1;
    }) || null;
  }

  // Pecas 3D vendidas no intervalo (de/ate 'AAAA-MM-DD'), com horas, gramas e kWh.
  function calcConsumo3d(de, ate) {
    var c = getCalc3d();
    var perda = 1 + num(c.perdaPct) / 100;
    var r = { pecas: {}, unidades: 0, horas: 0, gramas: 0, kwh: 0, luz: 0, insumos: {} };
    state.transacoes.forEach(function (t) {
      if (t.tipo !== 'venda' || !Array.isArray(t.itens) || !t.data || t.data < de || t.data > ate) return;
      t.itens.forEach(function (i) {
        var p = pecaDoItem(i.item_id);
        if (!p) return;
        var qtd = Number(i.quantidade) || 1;
        var imp = c.impressoras.find(function (x) { return x.id === p.impressoraId; }) || c.impressoras[0] || { watts: 100 };
        var porPlaca = Math.max(1, num(p.porPlaca) || 1);
        var h = num(p.horas) / porPlaca * qtd * perda;
        var kwh = h * num(imp.watts) / 1000;
        var e = r.pecas[p.id] || (r.pecas[p.id] = { nome: p.nome, unidades: 0, horas: 0, gramas: 0, kwh: 0 });
        e.unidades += qtd; e.horas += h; e.gramas += num(p.gramas) / porPlaca * qtd * perda; e.kwh += kwh;
        r.unidades += qtd; r.horas += h; r.gramas += num(p.gramas) / porPlaca * qtd * perda; r.kwh += kwh;
        (p.insumos || []).forEach(function (s) { r.insumos[s.nome] = (r.insumos[s.nome] || 0) + num(s.qtd) * qtd; });
      });
    });
    if (typeof falhasNoPeriodo === 'function') {
      var fx = falhasNoPeriodo(de, ate);
      r.falhas = fx; r.horas += fx.horas; r.kwh += fx.kwh; r.gramas += fx.gramas;
    }
    r.luz = r.kwh * num(c.kwh);
    r.lista = Object.keys(r.pecas).map(function (k) { return r.pecas[k]; }).sort(function (a, b) { return b.horas - a.horas; });
    return r;
  }

  function isoHoje(off) { var d = new Date(); d.setDate(d.getDate() + (off || 0)); return isoDia(d); }

  // Estoque de cada insumo e de cada filamento: contagem feita pelo vendedor + compras depois
  // dela - o que as vendas gastaram, pela ordem das compras (23-fifo.js).
  function calcEstoqueInsumos() {
    var c = getCalc3d();
    c.estoqueInsumos = c.estoqueInsumos || {};
    var itens = [];
    tiposFilamento().forEach(function (t) { if (c.filamentos.length) itens.push({ nome: nomeFilamentoEstoque(t), chave: 'fil:' + t.toUpperCase(), fator: 1000 }); });
    var nomes = {};
    c.embalagens.forEach(function (l) { if (l.nome) nomes[l.nome] = true; });
    c.produtos.forEach(function (p) { (p.insumos || []).forEach(function (s) { if (s.nome && num(s.qtd) > 0) nomes[s.nome] = true; }); });
    Object.keys(nomes).forEach(function (n) { itens.push({ nome: n, chave: 'emb:' + n, fator: 1 }); });
    var ini = isoHoje(-29);
    return itens.map(function (it) {
      var uso = usoPorDia(it.chave);
      var u30 = Object.keys(uso).reduce(function (s, d) { return s + (d >= ini ? uso[d] : 0); }, 0) / it.fator;
      var cont = c.estoqueInsumos[it.nome];
      var linha = { nome: it.nome, contado: !!cont, porDia: u30 / 30, semPreco: !lotesFifo(it.chave).length };
      if (cont) {
        var f = filaFifo(it.chave);
        var usado = Object.keys(uso).reduce(function (s, d) { return s + (d > cont.data ? uso[d] : 0); }, 0) / it.fator;
        var comprado = lotesFifo(it.chave).filter(function (l) { return l.data >= cont.data; }).reduce(function (s, l) { return s + l.qtd; }, 0) / it.fator;
        linha.sobra = num(cont.qtd) + comprado - usado;
        linha.comprado = comprado; linha.usado = usado; linha.desde = cont.data;
        linha.dias = linha.porDia > 0 ? Math.max(0, linha.sobra) / linha.porDia : null;
        if (f && f.fila.length) linha.loteAtual = { data: f.fila[0].data, unit: f.fila[0].unit * it.fator, semCompra: f.fila[0].semCompra };
      }
      return linha;
    }).sort(function (a, b) { return (a.dias === undefined || a.dias === null ? 1e9 : a.dias) - (b.dias === undefined || b.dias === null ? 1e9 : b.dias); });

  // ===================== COMPRAS: PAGOU A MAIS OU A MENOS =====================
  // Cada compra (filamento por tipo, insumo por nome) comparada com o preco que valia
  // antes dela (compras dos 30 dias anteriores, a mesma regra usada no custo das vendas).

  function compararCompras() {
    var c = getCalc3d();
    var linhas = [];
    function grupo(lotes, chave, campoQtd, unidade) {
      var porChave = {};
      lotes.forEach(function (l) { var k = chave(l); if (k) (porChave[k] = porChave[k] || []).push(l); });
      Object.keys(porChave).forEach(function (k) {
        var lista = porChave[k].filter(function (l) { return l.data && num(l[campoQtd]) > 0; })
          .sort(function (a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : 0; });
        lista.forEach(function (l, i) {
          var qtd = num(l[campoQtd]);
          var unit = (num(l.preco) + num(l.frete)) / qtd;
          var antes = lista.slice(0, i).filter(function (x) { return x.data < l.data; });
          var ref = antes.length ? precoMedioLotes(lotesDoPeriodo(antes, null), campoQtd, 1) : null;
          linhas.push({
            data: l.data, item: k, descricao: l.descricao || l.nome || k, qtd: qtd, unidade: unidade,
            pago: num(l.preco) + num(l.frete), unit: unit, ref: ref,
            difUnit: ref === null ? null : unit - ref,
            difTotal: ref === null ? null : (unit - ref) * qtd
          });
        });
      });
    }
    grupo(c.filamentos, function (l) { return 'Filamento ' + (l.tipo || '').toUpperCase(); }, 'kg', 'kg');
    grupo(c.embalagens, function (l) { return l.nome; }, 'qtd', 'un');
    linhas.sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });

    function agrupar(chave) {
      var g = {};
      linhas.forEach(function (x) {
        var k = chave(x.data);
        var r = g[k] || (g[k] = { mes: k, gasto: 0, aMais: 0, aMenos: 0, compras: 0, itens: [] });
        r.gasto += x.pago; r.compras += 1; r.itens.push(x);

  // ===================== CUSTO PELA ORDEM DAS COMPRAS (PEPS) =====================

  var memoFifo = { chave: null, filas: {} };

  // Lotes de um item, em unidades basicas: filamento em gramas, insumo na unidade cadastrada
  function lotesFifo(chave) {

  // Quanto deste item cada venda gastou, por dia

  // Monta a fila de um item: preco usado em cada dia de venda e o que sobra agora, lote a lote

  // ===================== FALHAS, MANUTENCOES E AVISOS DO DIA =====================

  // e baixa o filamento do estoque. Manutencao: gasto real quando acontece (nao ha desgaste fixo).
  // Fontes: producao.json no Gist (o Claude lanca pelo chat) + o que o vendedor lanca aqui.

  function dadosProducao() {
    var remoto = state.producaoRemota || lerLocal('ml-producao-remota', null) || {};
    var local = lerLocal('ml-producao-local', { falhas: [], manutencoes: [], excluidos: {}, vistos: {} });
    ['falhas', 'manutencoes', 'perdas'].forEach(function (k) { if (!local[k]) local[k] = []; });
    if (!local.excluidos) local.excluidos = {};

  }

  function pecaPorId(id) { return (getCalc3d().produtos || []).find(function (p) { return p.id === id; }) || null; }

  // Custo e consumo de uma falha
  function custoFalha(f) {
    var c = getCalc3d();
    var p = pecaPorId(f.pecaId);
    if (!p) return null;
    var fr = Math.min(100, Math.max(0, num(f.pct))) / 100;
    var porPlaca = Math.max(1, num(p.porPlaca) || 1);
    var gramas = num(p.gramas) / porPlaca * num(f.qtd) * fr;
    var horas = num(p.horas) / porPlaca * num(f.qtd) * fr;
    var imp = c.impressoras.find(function (x) { return x.id === p.impressoraId; }) || c.impressoras[0] || { watts: 100 };
    var kwh = horas * num(imp.watts) / 1000;
    var fil = gramas * custoGrama(p.tipo, f.data);

  function falhasNoPeriodo(de, ate) {

      if (!cf) return;
      r.total += cf.total; r.gramas += cf.gramas; r.horas += cf.horas; r.kwh += cf.kwh;
      r.porPeca[f.pecaId] = (r.porPeca[f.pecaId] || 0) + cf.total;
      r.lista.push({ f: f, c: cf });

  // Insumos perdidos fora das vendas (plastico rasgado, etiqueta que saiu errada...): producao.json

  function perdasInsumosNoPeriodo(de, ate) {

    dadosProducao().perdas.forEach(function (x) {

  function manutencoesNoPeriodo(de, ate) {

  // Gramas de filamento perdidos em falhas, por dia (para o estoque pela ordem das compras)

      if (g.lucro !== null) {

  // ===================== AVISOS DO DIA (INICIO) =====================

      av.push({ k: 't-' + t.id, icone: '✅', texto: (t.prazo < hoje ? 'Tarefa atrasada: ' : 'Tarefa para hoje: ') + t.titulo, ir: 'tarefas', botao: 'Ver tarefas', forte: t.prazo < hoje, fixo: true });

  // ===================== COPIA AUTOMATICA NA NUVEM =====================
  // Custos, Calculadora 3D, metas e o que o vendedor lanca aqui (tarefas, CPF, contas, falhas)
  // ficam no navegador. Com um token do GitHub so de "gist", o painel guarda uma copia no
  // mesmo Gist secreto da automacao (backup_painel.json) sempre que algo muda, e a automacao
  // guarda o historico dessa copia no repositorio privado. Tokens nunca entram na copia.

  var CHAVES_NUVEM = CHAVES_BACKUP.concat(['ml-tarefas-local', 'ml-cpf-local', 'ml-contas-local', 'ml-producao-local', 'ml-receber-local', 'ml-rotina-local']);
  var ARQ_BACKUP = 'backup_painel.json';

  function idDoGist(url) {
    var m = String(url || '').match(/gist\.githubusercontent\.com\/[^\/]+\/([0-9a-f]+)/i) || String(url || '').match(/gist\.github\.com\/(?:[^\/]+\/)?([0-9a-f]{20,})/i);
    return m ? m[1] : null;

  function tokenGist() { try { return localStorage.getItem('pml_ml-gist-token') || ''; } catch (e) { return ''; } }

  function montarCopia() {
    var dados = { tipo: 'backup-painel-top-brasil-shop', versao: 2, criadoEm: new Date().toISOString(), chaves: {} };
    CHAVES_NUVEM.forEach(function (k) { try { var v = localStorage.getItem('pml_' + k); if (v !== null) dados.chaves[k] = v; } catch (e) {} });
    dados.resumo = resumoParaTelegram();
    return dados;
  }
  // Lucro de hoje e do mes, para o comando /lucro do Telegram (a automacao nao tem os custos)
  function resumoParaTelegram() {
    try {
      var hoje = isoHoje(0), d = calcVendasDoDia(hoje), e = calcEscada(hoje.slice(0, 8) + '01', hoje);
      var bl = d.vendas.reduce(function (s, x) { return s + (x.lucro !== null ? x.valor : 0); }, 0);
      return { dia: hoje, hoje: { vendas: d.vendas.length, bruto: round2(d.bruto), lucro: round2(d.lucro), semCusto: d.semCusto, margem: bl > 0 ? round2(d.lucro / bl * 100) : null },
        mes: { vendeu: round2(e.t.receita), operacao: round2(e.t.lucro), real: round2(e.lucroReal), bolso: round2(e.bolso) } };
    } catch (err) { return null; }
  }

  async function salvarNaNuvem(forcar) {

  // ===================== PROTECAO DO LINK DO GIST =====================

  // ===================== ESCADA DO LUCRO =====================
  // Do faturamento ao bolso, degrau por degrau (definicao do Matheus):
  //   lucro da operacao = vendas - taxas/frete - imposto - custo dos produtos (- devolucoes e falhas)
  //   lucro real        = lucro da operacao - Ads ML - Ads Shopee - antecipacao - Full - outras cobrancas da fatura
  //   sobrou no bolso   = lucro real - contas fixas da loja (contador, parcelamento do Simples, assinaturas)
  // Investimentos (impressoras, curso) aparecem a parte. Comissao, frete e parcelamento da fatura ja
  // saem venda a venda (valor liquido do Mercado Pago), por isso nao entram de novo.

  var FATURA_FORA_DA_VENDA = { 'Antecipação': 'antecipacao', 'Publicidade': 'adsMl', 'Full': 'full', 'Outros': 'outros' };

  function diasEntre(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000) + 1; }

  // Cobrancas da fatura do ML que nao vem em cada venda, proporcionais aos dias do intervalo
  function faturaNoIntervalo(de, ate) {
    var r = { antecipacao: 0, adsMl: 0, bonusAds: 0, full: 0, outros: 0, temDados: false };
    var fat = state.faturamento, hoje = isoHoje(0);
    if (!fat || !Array.isArray(fat.periodos)) return r;
    fat.periodos.forEach(function (p) {
      if (!p.de || !p.ate || !(p.linhas || []).length) return;
      var fimReal = p.ate > hoje ? hoje : p.ate;          // fatura aberta: so ate hoje
      var ini = de > p.de ? de : p.de, fim = ate < fimReal ? ate : fimReal;
      if (ini > fim) return;
      var parte = diasEntre(ini, fim) / Math.max(1, diasEntre(p.de, fimReal));
      p.linhas.forEach(function (l) {
        var k = FATURA_FORA_DA_VENDA[l.categoria];  // a antecipacao pode ser trocada pelo valor real em calcEscada
        if (k && l.valor > 0) { r[k] += l.valor * parte; r.temDados = true; }
        // Bonificacao do Product Ads (credito do ML): abate do Ads do ML
        if (l.valor < 0 && (l.codigo === 'BPAD' || /publicidade|product ads/i.test(l.descricao || ''))) { r.adsMl += l.valor * parte; r.bonusAds += -l.valor * parte; }
      });
    });
    return r;
  }

  function calcEscada(de, ate) {
    var calc = calcLucroPorProduto(null, 'todas', { de: de, ate: ate });
    var t = { receita: 0, liquido: 0, imposto: 0, custo: 0, lucro: 0, receitaSemCusto: 0, semCusto: 0 };
    var outrosVenda = 0;
    calc.linhas.forEach(function (g) {
      if (g.lucro === null) { t.receitaSemCusto += g.receita; t.semCusto++; return; }
      t.receita += g.receita; t.liquido += g.liquido;
      t.imposto += g.imposto; t.custo += g.custoTotal; t.lucro += g.lucro;
      outrosVenda += g.liquido - g.imposto - g.custoTotal - g.lucro;   // tarifas de devolucao e falhas
    });
    // Insumos perdidos fora das vendas
    var perdas = typeof perdasInsumosNoPeriodo === 'function' ? perdasInsumosNoPeriodo(de, ate).total : 0;
    t.lucro -= perdas; outrosVenda += perdas;
    var adsSp = 0;
    ((state.adsShopee && state.adsShopee.dias) || []).forEach(function (d) { if (d.data >= de && d.data <= ate) adsSp += Number(d.gasto) || 0; });
    var fat = faturaNoIntervalo(de, ate);
    // Antecipacao cobrada de verdade (relatorio de liberacoes) em vez da fatura repartida pelos dias
    var antReal = typeof antecipacaoNoIntervalo === 'function' ? antecipacaoNoIntervalo(de, ate) : null;
    if (antReal !== null) { fat.antecipacao = antReal; fat.antecipacaoReal = true; }
    var lucroReal = t.lucro - adsSp - fat.adsMl - fat.antecipacao - fat.full - fat.outros;

    // Contas do mes do fim do intervalo: fixas da loja x investimentos (o DAS ja esta no imposto)
    var fixas = 0, invest = 0, listaFixas = [], listaInvest = [];
    resumoContasMes(ate.slice(0, 7)).linhas.forEach(function (l) {
      if (l.quem !== 'empresa' || l.das) return;
      var itens = l.cartao ? l.itens.filter(function (i) { return (i.conta.de || 'empresa') === 'empresa'; }).map(function (i) { return { nome: i.conta.nome, valor: i.valor, cat: i.conta.categoria }; }) : [{ nome: l.nome, valor: l.valor, cat: l.categoria }];
      itens.forEach(function (i) {
        if (/Equipamento|Curso/i.test(i.cat || '')) { invest += i.valor; listaInvest.push(i); } else { fixas += i.valor; listaFixas.push(i); }
      });
    });
    return {
      de: de, ate: ate, t: t, outrosVenda: outrosVenda, adsShopee: adsSp, fatura: fat, lucroReal: lucroReal,
      fixas: fixas, listaFixas: listaFixas, invest: invest, listaInvest: listaInvest, bolso: lucroReal - fixas
    };
  }

  function renderEscadaCard(wrap, de, ate, titulo) {
    var e = calcEscada(de, ate), t = e.t;
    var card = el('div', { class: 'pml-card' }, [el('p', { class: 'pml-section-title', text: titulo || 'Do faturamento ao seu bolso' })]);
    var cobertas = t.receita - t.receitaSemCusto;
    function degrau(rotulo, valor, explica, tipo) {

        el('div', { class: 'escada-valor', text: (tipo === 'menos' ? (valor < 0 ? '+ ' : '− ') : (valor < 0 ? '− ' : '')) + fmtMoney(Math.abs(valor)) })
      ]);

    card.appendChild(degrau('Vendeu', t.receita, 'tudo o que entrou de pedidos (ML e Shopee)', 'total'));
    card.appendChild(degrau('Comissões, taxas e frete', t.receita - t.liquido, 'o que o ML e a Shopee descontam de cada venda' + pct(t.receita - t.liquido), 'menos'));
    card.appendChild(degrau('Imposto (Simples)', t.imposto, '', 'menos'));
    card.appendChild(degrau('Custo dos produtos', t.custo, 'o que você pagou em cada produto vendido (peças 3D pelo custo real)', 'menos'));
    if (Math.abs(e.outrosVenda) >= 0.5) card.appendChild(degrau('Devoluções, falhas e perdas', e.outrosVenda, 'tarifas de devolução, peças que falharam e insumos perdidos', 'menos'));
    card.appendChild(degrau('Lucro da operação', t.lucro, 'o que os produtos deixaram' + pct(t.lucro), 'subtotal'));

    card.appendChild(degrau('Ads do Mercado Livre', e.fatura.adsMl, 'da fatura do ML' + (e.fatura.bonusAds >= 0.5 ? ', já tirando ' + fmtMoney(e.fatura.bonusAds) + ' que o ML devolveu de bonificação' : ''), 'menos'));
    card.appendChild(degrau('Antecipação do Mercado Pago', e.fatura.antecipacao, e.fatura.antecipacaoReal ? 'o que o Mercado Pago cobrou de verdade nesses dias' : 'para receber antes do prazo (fatura repartida pelos dias)', 'menos'));
    card.appendChild(degrau('Full e outras cobranças', e.fatura.full + e.fatura.outros, 'armazenagem do Full e outras cobranças da fatura', 'menos'));
    card.appendChild(degrau('Lucro real', e.lucroReal, 'o que a loja gerou de verdade' + pct(e.lucroReal), 'destaque ' + (e.lucroReal >= 0 ? 'pos' : 'neg')));
    card.appendChild(degrau('Contas fixas da loja', e.fixas, e.listaFixas.map(function (i) { return i.nome; }).join(', ') || 'nenhuma lançada', 'menos'));
    card.appendChild(degrau('Sobrou no bolso', e.bolso, '', 'destaque ' + (e.bolso >= 0 ? 'pos' : 'neg')));
    if (e.invest) card.appendChild(el('p', { class: 'pml-note', text: 'Investimentos no mês (fora da conta, porque viram patrimônio): ' + e.listaInvest.map(function (i) { return i.nome + ' ' + fmtMoney(i.valor); }).join(' · ') + ' = ' + fmtMoney(e.invest) + '.' }));
    var notas = [];
    if (state.liberacoes && state.liberacoes.pedidos) notas.push('Vendas do ML já liberadas usam o que caiu na sua conta (relatório de liberações do Mercado Pago), com devoluções e frete devolvido.');
    if (t.semCusto) notas.push(t.semCusto + ' produto(s) sem custo cadastrado (' + fmtMoney(t.receitaSemCusto) + ' em vendas) ficaram fora do lucro.');
    if (!e.fatura.temDados) notas.push('A fatura do ML deste período ainda não chegou: Ads do ML, antecipação e Full podem estar faltando.');
    else notas.push('Cobranças da fatura do ML entram proporcionais aos dias do período.');
    if (!(state.adsShopee && (state.adsShopee.dias || []).length)) notas.push('Os dados de Ads da Shopee não chegaram: o Ads da Shopee está faltando.');
    card.appendChild(el('p', { class: 'pml-note', text: notas.join(' ') + ' As contas fixas são as do mês, lançadas na aba Contas (o DAS do mês já está no imposto).' }));
    if (cobertas <= 0 && t.receita > 0) card.appendChild(el('p', { class: 'pml-note', style: 'color:var(--bad);', text: 'Cadastre os custos dos produtos para ver o lucro.' }));
    wrap.appendChild(card);
  }
  // ===================== SIMULADOR DE KITS (SHOPEE) =====================
  // A Shopee cobra uma taxa fixa por pedido (R$ 4,50) alem da porcentagem. Num kit de 2 ou 3
  // unidades a taxa fixa e paga uma vez so. A porcentagem de cada produto sai das vendas reais
  // dos ultimos 30 dias: (taxas - taxa fixa x pedidos) / vendido. Imposto e custo como no lucro.

  var TAXA_FIXA_SHOPEE = 4.5;
  var KITS = [{ n: 1, desc: 0 }, { n: 2, desc: 0.05 }, { n: 3, desc: 0.08 }];

  function calcKits(dias) {
    var imp = (Number(state.configLucro.imposto) || 0) / 100;
    return calcLucroPorProduto(dias || 30, 'shopee').linhas.filter(function (g) {
      return g.custoUnit !== null && g.unidades >= 5 && g.receita > 0;
    }).map(function (g) {
      var pedidos = Math.max(1, g.vendas || g.unidades);
      var preco = g.receita / g.unidades;
      var pct = Math.max(0, ((g.receita - g.liquido) - TAXA_FIXA_SHOPEE * pedidos) / g.receita);
      var op = KITS.map(function (k) {
        var precoKit = k.n * preco * (1 - k.desc);
        var lucroKit = precoKit * (1 - pct - imp) - TAXA_FIXA_SHOPEE - k.n * g.custoUnit;
        return { n: k.n, desc: k.desc, preco: precoKit, lucroKit: lucroKit, porUnidade: lucroKit / k.n };
      });
      return { itemId: g.itemId, titulo: g.titulo, unidades: g.unidades, preco: preco, pct: pct, custo: g.custoUnit, op: op };
    }).sort(function (a, b) { return b.unidades - a.unidades; });
  }

  function renderKitsCard(wrap) {
    var lista = calcKits(30);
    if (!lista.length) return;
    var card = el('div', { class: 'pml-card' }, [
      el('p', { class: 'pml-section-title', text: 'Kits na Shopee: quanto sobra vendendo 2 ou 3 juntos' }),
      el('p', { class: 'pml-margin', style: 'margin:0 0 10px;', text: 'A taxa fixa de ' + fmtMoney(TAXA_FIXA_SHOPEE) + ' é cobrada uma vez por pedido. No kit ela se divide entre as unidades, então dá para dar um desconto e ainda lucrar mais. Simulação com as taxas reais de cada produto (30 dias): kit de 2 com 5% de desconto e kit de 3 com 8%.' })
    ]);
    var t = el('table', { class: 'pml-table' });
    t.appendChild(el('tr', {}, ['Produto', '1 unidade', 'Kit de 2', 'Kit de 3', 'Ganho por unidade no kit de 2'].map(function (h, i) { return el('th', { class: i ? 'num' : '', text: h }); })));
    lista.forEach(function (k) {
      var g2 = k.op[1].porUnidade - k.op[0].porUnidade;
      function cel(o) {
        return el('td', { class: 'num' }, [
          el('div', { style: 'font-weight:700; color:' + (o.lucroKit >= 0 ? 'var(--good)' : 'var(--bad)'), text: fmtMoney(o.lucroKit) }),
          el('div', { class: 'pml-margin', text: 'vende a ' + fmtMoney(o.preco) + (o.n > 1 ? ' · ' + fmtMoney(o.porUnidade) + '/un.' : '') })
        ]);
      }
      t.appendChild(el('tr', {}, [
        el('td', {}, [el('div', { text: k.titulo }), el('div', { class: 'pml-margin', text: k.unidades + ' vendidas · taxa ' + fmtPct(k.pct) + ' + ' + fmtMoney(TAXA_FIXA_SHOPEE) + ' por pedido · custo ' + fmtMoney(k.custo) })]),
        cel(k.op[0]), cel(k.op[1]), cel(k.op[2]),
        el('td', { class: 'num', style: 'font-weight:700; color:' + (g2 >= 0 ? 'var(--good)' : 'var(--bad)'), text: (g2 >= 0 ? '+' : '') + fmtMoney(g2) + (k.op[0].porUnidade > 0 ? ' (' + (g2 >= 0 ? '+' : '') + fmtPct(g2 / k.op[0].porUnidade) + ')' : '') })
      ]));

    card.appendChild(el('p', { class: 'pml-note', text: 'Cada valor é o lucro do pedido inteiro, já sem taxas, imposto e custo, e antes do Ads. No kit, a embalagem pode sair mais barata (1 saco e 1 etiqueta para tudo). Na Shopee dá para criar o kit como variação do anúncio ("2 unidades") ou usar o Desconto por quantidade ("leve 2, pague menos").' }));

  // ===================== LIBERACOES DO MERCADO PAGO =====================
  // O dinheiro que entrou e saiu de verdade em cada venda do ML (liberacoes_mp.json da automacao,
  // o mesmo relatorio de "Relatorios > Liberacoes" do Mercado Pago). Quando a venda ja foi liberada,
  // ele vale mais que a API: inclui o frete devolvido em linha separada, a devolucao descontada dias
  // depois e a reclamacao encerrada a favor do vendedor. Venda ainda nao liberada usa a API.

  function pedidoMlDe(t) {
    var m = /^api-ml-(\d+)-/.exec((t && t.origemId) || '');
    return m ? m[1] : null;
  }

  function liberacaoDoPedido(t) {
    var L = state.liberacoes;
    if (!L || !L.pedidos) return null;
    var id = pedidoMlDe(t);
    return id ? (L.pedidos[id] || null) : null;
  }

  // total: tudo o que o pedido deixou na conta. devolvido: o comprador recebeu o dinheiro de volta
  // (o produto voltou, entao o custo dele nao conta; fica so o prejuizo do frete e das taxas).
  function vendaPeloExtrato(t) {
    var l = liberacaoDoPedido(t);
    if (!l) return null;
    var dev = Number(l.devolucao) || 0;
    var total = round2((Number(l.liquido) || 0) + dev + (Number(l.outros) || 0));
    var teveDev = Math.abs(dev) > 0.005;
    return { liquido: total, comDevolucao: teveDev, devolvido: teveDev && total <= 0.01 };
  }

  // Cancelamento em que o dinheiro ficou com o vendedor (ex.: reclamacao encerrada a favor dele e
  // produto descartado pelo ML): na pratica e uma venda, e o produto foi embora.
  function cancelamentoQueFicou(t) {
    if (!t || t.tipo !== 'cancelamento' || !Array.isArray(t.itens) || !t.itens.length) return null;
    var e = vendaPeloExtrato(t);
    return e && e.liquido > 0.5 ? e : null;
  }

  // Tarifa de antecipacao cobrada de verdade no intervalo. null = o relatorio nao cobre esses dias.
  function antecipacaoNoIntervalo(de, ate) {
    var L = state.liberacoes;
    if (!L || !L.antecipacao || !Array.isArray(L.cobertura)) return null;
    var ontem = isoHoje(-1);
    var fim = ate < ontem ? ate : ontem;
    var coberto = L.cobertura.some(function (c) { return c[0] <= de && c[1] >= fim; });
    if (!coberto) return null;
    return Object.keys(L.antecipacao).reduce(function (s, d) {
      return d >= de && d <= ate ? s + (Number(L.antecipacao[d]) || 0) : s;
    }, 0);
  }
  // ===================== PREVISAO DE CAIXA =====================
  // Quanto vai ter no dia X: saldo do Mercado Pago (relatorio de liberacoes) + o que ainda vai liberar
  // (ML: data de liberacao de cada venda; Shopee: pedido nao concluido, ~10 dias depois da compra,
  // a mediana do relatorio de renda) - contas que vencem (aba Contas, ainda nao pagas).

  var SHOPEE_DIAS_LIBERAR = 10;

  function addDias(iso, n) { var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDia(d); }

  function calcCaixa(dias) {
    dias = dias || 30;
    var hoje = isoHoje(0), fim = addDias(hoje, dias - 1);
    var L = state.liberacoes || {};
    var saldo = L.saldo ? Number(L.saldo.valor) || 0 : null;
    var mov = {};   // dia -> { entra, sai, itens: [] }
    function lanca(dia, valor, nome, tipo) {
      if (dia < hoje) dia = hoje;            // atrasado: conta para hoje
      if (dia > fim || !valor) return;
      var m = mov[dia] || (mov[dia] = { entra: 0, sai: 0, itens: [] });
      if (tipo === 'entra') m.entra += valor; else m.sai += valor;

    var mlPend = 0, spPend = 0;
    state.transacoes.forEach(function (t) {
      if (t.tipo !== 'venda') return;
      if (t.custosMl) {
        var c = t.custosMl;
        if (!c.libera_em || liberacaoDoPedido(t)) return;          // ja caiu na conta
        var v = Number(c.liquido_recebido) || 0;
        if (v <= 0 || c.libera_em < addDias(hoje, -7)) return;      // antigo demais: ja deve ter caido
        mlPend += v; lanca(c.libera_em, v, 'Mercado Livre', 'entra');
      } else if (t.custosShopee && /^api-shopee-/.test(t.origemId || '')) {
        var st = String((t.custosShopee && t.custosShopee.status) || t.status || '');
        if (st === 'COMPLETED') return;
        var s = Number(t.custosShopee.liquido_recebido) || 0;
        if (s <= 0 || t.data < addDias(hoje, -30)) return;
        spPend += s; lanca(addDias(t.data, SHOPEE_DIAS_LIBERAR), s, 'Shopee', 'entra');
      }
    });
    var contas = [];
    [hoje.slice(0, 7), somaMes(hoje.slice(0, 7), 1), somaMes(hoje.slice(0, 7), 2)].forEach(function (m) {
      contasDoMes(m).forEach(function (l) {

    for (var i = 0; i < dias; i++) {

  // ===================== AUDITOR, FAIXA DE PRECO E RANKING =====================

  // ---- Auditor de cobrancas (ML): o que devia cair x o que caiu de verdade ----

  function calcAuditoria(dias) {

      if (t.tipo !== 'venda' || !t.custosMl || t.data < lim) return;

      var caiu = round2(Number(l.liquido) || 0), dif = round2(caiu - devia);

    });
    r.sort(function (a, b) { return a.dif - b.dif; });

  // ---- Preco na faixa errada (ML): logo acima de R$ 79 voce paga o frete gratis ----
  var LIMITE_FRETE_ML = 79, PRECO_SUGERIDO = 78.9;
  function calcFaixaPreco(dias) {
    var lim = limiteDias(dias || 60), itens = {}, baratos = [];
    state.transacoes.forEach(function (t) {
      if (t.tipo !== 'venda' || !t.custosMl || t.data < lim || !Array.isArray(t.itens) || t.itens.length !== 1) return;
      var i = t.itens[0], q = Number(i.quantidade) || 1, p = Number(i.preco_unitario) || (t.valor / q);
      var c = t.custosMl, fr = Number(c.frete) || 0;
      if (p < LIMITE_FRETE_ML) { baratos.push(fr / q); return; }
      if (p > 95 || q !== 1) return;
      var g = itens[i.item_id] || (itens[i.item_id] = { itemId: i.item_id, titulo: i.titulo, n: 0, preco: 0, frete: 0, comissao: 0 });
      g.n++; g.preco += p; g.frete += fr; g.comissao += Number(c.comissao) || 0;
    });
    baratos.sort(function (a, b) { return a - b; });
    var freteBarato = baratos.length ? baratos[Math.floor(baratos.length / 2)] : 0;

    }).filter(function (x) { return x.ganho > 0.5 && x.frete >= 8; }).sort(function (a, b) { return b.ganho * b.vendas - a.ganho * a.vendas; });

  // ---- Ranking do lucro de verdade por anuncio, com o que fazer ----
  function calcRanking(dias, plat) {
    var ads = calcAdsPorProduto(plat || 'todas'), gasto = {};
    ((ads && ads.linhas) || []).forEach(function (x) { gasto[String(x.itemId).toUpperCase()] = (gasto[String(x.itemId).toUpperCase()] || 0) + x.gasto * (dias / (ads.dias || 30)); });

      var a = gasto[String(g.itemId).toUpperCase()] || 0, real = g.lucro - a, margem = g.receita ? real / g.receita : 0;
      var acao;
      if (real < 0) acao = a > 0 && g.lucro > 0 ? 'baixar Ads' : 'subir preço ou pausar';
      else if (a > 0 && a > g.lucro * 0.4) acao = 'baixar Ads';

  // ===================== PLANO DE IMPRESSAO DO DIA =====================
  // Ritmo de vendas de cada peca 3D (ultimos 14 dias) + estoque pronto (o vendedor informa) +
  // horas das impressoras -> o que imprimir hoje para nao faltar o que mais vende.

  var PLANO_DIAS_COBRIR = 7, PLANO_HORAS_DIA = 20;

  function calcPlanoImpressao() {
    var c = getCalc3d();
    var estoque = c.estoquePecas || {};
    var u = unidadesPorItem(14), porPeca = {};
    Object.keys(u).forEach(function (id) {
      var p = pecaDoItem(id);
      if (p) porPeca[p.id] = (porPeca[p.id] || 0) + u[id];
    });
    var nImp = Math.max(1, (c.impressoras || []).length);
    var capacidade = nImp * PLANO_HORAS_DIA;
    var lista = (c.produtos || []).filter(function (p) { return num(p.horas) > 0 && porPeca[p.id]; }).map(function (p) {
      var ritmo = porPeca[p.id] / 14, tem = num(estoque[p.id]);
      var porPlaca = Math.max(1, num(p.porPlaca) || 1), hPlaca = num(p.horas);
      var precisa = Math.max(0, Math.ceil(ritmo * PLANO_DIAS_COBRIR - tem));
      var placas = Math.ceil(precisa / porPlaca);
      return { id: p.id, nome: p.nome, ritmo: ritmo, estoque: tem, duraDias: ritmo ? tem / ritmo : 99, precisa: precisa,
        placas: placas, horas: placas * hPlaca, porPlaca: porPlaca, hPlaca: hPlaca };
    }).sort(function (a, b) { return a.duraDias - b.duraDias; });
    // Hoje: reparte as horas das impressoras uma placa por vez, pela ordem de urgencia, para nao
    // gastar o dia todo numa peca so e deixar faltar as outras.
    var livre = capacidade, mudou = true;
    lista.forEach(function (x) { x.hojePlacas = 0; });
    while (mudou) {
      mudou = false;
      lista.forEach(function (x) {
        if (x.hojePlacas < x.placas && x.hPlaca > 0 && x.hPlaca <= livre) { x.hojePlacas++; livre -= x.hPlaca; mudou = true; }
      });
    }
    lista.forEach(function (x) { x.hojePecas = x.hojePlacas * x.porPlaca; x.informado = Object.prototype.hasOwnProperty.call(estoque, x.id); });
    return { lista: lista, capacidade: capacidade, usadas: capacidade - livre, impressoras: nImp };
  }

  function render() {

    renderTabs(wrap);
    if (!state.loaded) {
      wrap.appendChild(el('div', { class: 'pml-empty', text: 'Carregando seu painel...' }));
      root.appendChild(wrap);
      return;
    }
    if (state.errorMsg) {
      wrap.appendChild(el('div', { class: 'pml-error', text: state.errorMsg }));
    }
    if (sincronizacaoAtrasada()) {
      wrap.appendChild(el('div', { class: 'pml-import-summary', style: 'border:1px solid var(--bad-line); color:var(--bad); margin-bottom:16px;', text: '⚠ A sincronização automática não roda há mais de 2 dias. Confere se a automação no GitHub Actions ainda está rodando, ou sincronize manualmente na aba Importar.' }));
    }
    var horasSemAtualizar = horasDesdeAtualizacaoAutomacao();
    if (horasSemAtualizar !== null && horasSemAtualizar > 6) {
      wrap.appendChild(el('div', { class: 'pml-import-summary', style: 'border:1px solid var(--bad-line); color:var(--bad); margin-bottom:16px;', text: '⚠ A automação do Mercado Livre não manda dados novos há ' + Math.round(horasSemAtualizar) + ' horas. As vendas mais recentes podem não estar aparecendo. Verifique a automação no GitHub (aba Actions).' }));
    }
    if (state.tab === 'estoque' || state.tab === 'financeiro' || state.tab === 'importar') renderMetrics(wrap);
    if (state.tab === 'geral') {
      renderInicio(wrap);
    } else if (state.tab === 'estoque') {
      renderEstoqueTab(wrap);
    } else if (state.tab === 'lucro') {
      renderLucroTab(wrap);
    } else if (state.tab === 'calc3d') {
      renderCalc3dTab(wrap);
    } else if (state.tab === 'tarefas') {
      renderTarefasTab(wrap);
    } else if (state.tab === 'contas') {
      renderContasTab(wrap);
    } else if (state.tab === 'dia') {
      renderMeuDia(wrap);
    } else if (state.tab === 'conquistas') {
      renderConquistasTab(wrap);
    } else if (state.tab === 'receber') {
      renderReceberTab(wrap);
    } else if (state.tab === 'cpf') {
      renderCpfTab(wrap);
    } else if (state.tab === 'relatorio') {
      renderRelatorioTab(wrap);
    } else if (state.tab === 'financeiro') {
      renderFinanceiroTab(wrap);
    } else {
      renderBackupNuvemCard(wrap);
      renderImportarTab(wrap);
      renderBackupCard(wrap);
    }
    root.appendChild(wrap);
  }

  // Link direto para uma aba (ex.: .../painel-negocios/#relatorio, usado no aviso do Telegram)
  var abaDoLink = (location.hash || '').replace('#', '');
  if (['dia', 'geral', 'lucro', 'calc3d', 'estoque', 'financeiro', 'relatorio', 'tarefas', 'contas', 'receber', 'cpf', 'conquistas', 'importar'].indexOf(abaDoLink) !== -1) state.tab = abaDoLink;

  if (!abaDoLink || /[?&]bomdia=1/.test(location.search)) abrirMeuDiaHoje();
  mostrarIntro();
  loadData();
})();
</script>
</body>
</html>
